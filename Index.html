/* ===========================================================================
   SÉRIES AGREGADAS (Notas, Histórico, Carteira)
   Carregadas sob demanda: só a primeira tela que precisa paga a leitura do
   HISTORICO. Depois fica em memória até recarregar a página.
   =========================================================================== */
var SERIES = null;
var SERIES_CARREGANDO = false;

function comSeries(aoPronto){
  if(SERIES){ aoPronto(SERIES); return; }
  if(SERIES_CARREGANDO) return;
  SERIES_CARREGANDO = true;
  document.getElementById('conteudo').innerHTML =
    '<div class="carregando"><div class="giro"></div>Lendo o histórico mensal…</div>';
  chamar('api_seriesAgregadas', [], function(res){
    SERIES_CARREGANDO = false;
    SERIES = res;
    aoPronto(SERIES);
  }, function(){
    SERIES_CARREGANDO = false;
    document.getElementById('conteudo').innerHTML =
      '<div class="vazio"><div class="vazio-ico">!</div>Não foi possível ler o histórico mensal.'+
      '<div style="margin-top:10px;"><button class="btn btn-1" onclick="SERIES=null;roteador()">Tentar de novo</button></div></div>';
  });
}

/** Recorta a série da carteira pelo período escolhido na tela. */
function carteiraNoPeriodo(){
  var p = periodoAtual();
  return (SERIES.carteira||[]).filter(function(x){
    return x.chave >= p.de && x.chave <= p.ate;
  });
}

/** Soma os anos de uma empresa dentro da janela de anos exibida. */
function anoDaEmpresa(cnpj, ano){
  var e = (SERIES.porEmpresa||{})[cnpj];
  var a = e && e[ano];
  return a ? {fat:a[0], notasQtd:a[1], notasValor:a[2], func:a[3], meses:a[4]}
           : {fat:0, notasQtd:0, notasValor:0, func:0, meses:0};
}

/* ===========================================================================
   INTERVALO ABERTO — escolher início e fim da consulta
   ---------------------------------------------------------------------------
   As faixas prontas (mês, trimestre, ano) respondem "os últimos N meses".
   Não respondem "o que venceu entre março e junho", que é como a cobrança e
   o fiscal trabalham. Estas três telas ganham início e fim livres.

   As opções listam só as competências que EXISTEM no dado daquela tela — não
   adianta oferecer 2023 para a saúde fiscal se o Diagnóstico só tem 08/2026.
   =========================================================================== */
var INTERVALO = {};        // rota -> {de, ate}

function intervaloDaTela(){
  return INTERVALO[S.rota] || null;
}
function definirIntervalo(de, ate){
  INTERVALO[S.rota] = (de || ate) ? {de:de||'', ate:ate||''} : null;
  try{ localStorage.setItem('escr_intervalos', JSON.stringify(INTERVALO)); }catch(e){}
}

/**
 * Desenha os dois seletores no topo.
 * @param {Array} comps competências disponíveis (AAAAMM), já ordenadas
 */
function desenharIntervalo(comps){
  var el = document.getElementById('topo-periodo');
  if(!el) return;
  comps = (comps || []).filter(function(c){ return /^\d{6}$/.test(c); });
  if(!comps.length){
    el.innerHTML = '<div class="periodo" style="background:var(--surface-2);">'+
      '<label>Período</label><span class="periodo-int" style="border:0;padding:0;">'+
      'sem competências no dado</span></div>';
    return;
  }
  // Sem escolha do usuário, mostra a janela padrão da tela — o mesmo recorte
  // que os números já estão usando, para o controle não contradizer a tela.
  var pad = periodoAtual();
  var atual = intervaloDaTela() || {de: pad.de === '000000' ? comps[0] : pad.de, ate: pad.ate};
  if(comps.indexOf(atual.de) < 0) atual.de = comps[0];
  if(comps.indexOf(atual.ate) < 0) atual.ate = comps[comps.length-1];
  function opcoes(sel){
    return comps.map(function(c){
      return '<option value="'+c+'"'+(c===sel?' selected':'')+'>'+compDisplay(c)+'</option>';
    }).join('');
  }
  var tudo = atual.de === comps[0] && atual.ate === comps[comps.length-1];
  var escolhido = !!intervaloDaTela();
  el.innerHTML =
    '<div class="periodo">'+
      '<label for="iv-de">De</label>'+
      '<select id="iv-de">'+opcoes(atual.de)+'</select>'+
      '<label for="iv-ate" style="margin-left:4px;">até</label>'+
      '<select id="iv-ate">'+opcoes(atual.ate)+'</select>'+
      '<span class="periodo-int">'+(tudo ? 'tudo' : fmtNum(mesesEntre(atual.de, atual.ate))+' meses')+'</span>'+
      '<button class="btn btn-p btn-fantasma" id="iv-tudo" style="margin-left:6px;" '+
        'title="Usar todo o período disponível">tudo</button>'+
      (escolhido ? '<button class="btn btn-p btn-fantasma" id="iv-limpar" '+
        'title="Voltar ao padrão da tela">padrão</button>' : '')+
    '</div>';

  function aplicar(){
    var de = document.getElementById('iv-de').value;
    var ate = document.getElementById('iv-ate').value;
    if(de > ate){ var t = de; de = ate; ate = t; }   // inverteu: corrige em silêncio
    definirIntervalo(de, ate);
    PERIODO_APLICADO = null;   // a janela mudou: recalcula antes de redesenhar
    roteador();
  }
  document.getElementById('iv-de').addEventListener('change', aplicar);
  document.getElementById('iv-ate').addEventListener('change', aplicar);
  var tud = document.getElementById('iv-tudo');
  if(tud) tud.addEventListener('click', function(){
    definirIntervalo(comps[0], comps[comps.length-1]); PERIODO_APLICADO=null; roteador(); });
  var lim = document.getElementById('iv-limpar');
  if(lim) lim.addEventListener('click', function(){
    definirIntervalo(null,null); PERIODO_APLICADO=null; roteador(); });
}

function mesesEntre(de, ate){
  if(!de || !ate) return 0;
  var a1 = +de.slice(0,4), m1 = +de.slice(4,6), a2 = +ate.slice(0,4), m2 = +ate.slice(4,6);
  return (a2-a1)*12 + (m2-m1) + 1;
}

/** Intervalo efetivo da tela: o escolhido, ou tudo que existe. */
function faixaConsulta(comps){
  var iv = intervaloDaTela();
  if(iv && (iv.de || iv.ate)) return {de:iv.de, ate:iv.ate};
  comps = (comps||[]).filter(function(c){ return /^\d{6}$/.test(c); });
  return {de: comps[0] || '', ate: comps[comps.length-1] || ''};
}
function rotuloConsulta(comps){
  var f = faixaConsulta(comps);
  if(!f.de && !f.ate) return 'todo o período';
  if(f.de === f.ate) return compDisplay(f.de);
  return compDisplay(f.de)+' – '+compDisplay(f.ate);
}

/* ===========================================================================
   PERÍODO QUE REALMENTE MOVE OS DADOS
   ---------------------------------------------------------------------------
   Antes o seletor aparecia em toda tela mas só valia onde havia soma por
   competência. Nas demais ele trocava o rótulo e o número ficava igual — pior
   que não ter filtro, porque dava a impressão de que a carteira não mudou.

   Agora a troca de período recalcula, em UM lugar, os campos derivados de
   cada empresa, e toda tela passa a ler o resultado sem saber que existe
   período. Três grandezas diferentes, de propósito:

     fatPeriodo  soma do faturamento DENTRO da janela escolhida. É o que varia
                 com o filtro e responde "quanto ele faturou nesse recorte".
     rbt12       sempre 12 meses, terminando no fim da janela. Faixa do Simples
                 é definida em lei por 12 meses — encolher a janela aqui
                 rebaixaria a empresa de faixa e a conta sairia errada.
     varFat      variação dentro da janela: primeira metade contra a segunda.

   O que NÃO varia com o período, porque é foto e não série: inadimplência
   (posição do Asaas na extração), pendência fiscal (competência do
   Diagnóstico) e relacionamento. Nessas telas o seletor fica desligado e a
   tela diz de onde vem a data — mentir seria pior.
   =========================================================================== */

/* Telas cujo dado é uma foto: o seletor some, com o motivo à mostra. */
var TELAS_SEM_PERIODO = {
  relacionamento: 'Situação atual registrada pelo time',
  parametros: '', regras: '', precificacao: ''
};

var PERIODO_APLICADO = null;

/**
 * Recalcula os campos derivados de todas as empresas para a janela ativa.
 * Só refaz quando a janela muda de verdade — trocar de tela não recalcula.
 */
function aplicarPeriodo(){
  if(!SERIES || !SERIES.serieEmpresa) return false;
  var p = periodoAtual();   // já resolve o intervalo escolhido ou o padrão
  var chave = p.de + '-' + p.ate;
  if(PERIODO_APLICADO === chave) return false;

  var meses = SERIES.meses || [];
  var iDe  = p.de === '000000' ? 0 : indiceDe(meses, p.de, true);
  var iAte = indiceDe(meses, p.ate, false);
  if(iAte < 0) iAte = meses.length - 1;
  if(iDe < 0) iDe = 0;
  var iRbtDe = Math.max(0, iAte - 11);   // RBT12 = 12 meses fechando na janela

  var i90De = Math.max(0, iAte - 2);   // 90 dias = 3 competências fechando na janela

  S.empresas.forEach(function(e){
    var pares = SERIES.serieEmpresa[e.cnpj] || [];
    var fatP = 0, rbt = 0, nP = 0, f90 = 0, n90 = 0, metade = Math.floor((iDe + iAte) / 2);
    var ini = 0, fim = 0;
    for(var k = 0; k < pares.length; k++){
      var i = pares[k][0], v = pares[k][1] || 0;
      if(i >= iDe && i <= iAte){ fatP += v; nP++; if(i <= metade) ini += v; else fim += v; }
      if(i >= iRbtDe && i <= iAte) rbt += v;
      if(i >= i90De && i <= iAte){ f90 += v; n90++; }
    }
    e.fatPeriodo = Math.round(fatP * 100) / 100;
    e.mesesPeriodo = nP;
    e.rbt12 = Math.round(rbt * 100) / 100;
    // Diretoria: ao lado do RBT12, a media mensal. RBT12/12 sempre sobre 12 meses,
    // mesmo quando a empresa so tem parte do ano na base -- e a media do
    // faturamento anualizado, nao a media dos meses que existem.
    e.mediaMensal = Math.round(e.rbt12 / 12 * 100) / 100;
    e.fat90 = Math.round(f90 * 100) / 100;
    e.meses90 = n90;
    e.varPeriodo = ini > 0 ? (fim - ini) / ini : null;

    // faixa e porte acompanham o RBT12 recalculado
    var f = faixaPorRbt(e.rbt12);
    e.faixa = f.rotulo;
    e.porte = f.porte;
    // defasagem contra o piso continua valendo; o piso depende da faixa
    var pl = planoPorFaixa(e, f.numero);
    e.planoIndicado = pl.nome;
    e.pisoPlano = pl.piso;
    e.gapPlano = num(e.honorarioAtual) ? Math.max(0, pl.piso - num(e.honorarioAtual)) : 0;

    /* Regra pedida: quem esta SEM FATURAMENTO e paga pelo menos 10% do salario
       minimo ja esta OK -- a empresa parada nao sustenta piso de plano, e o que
       se cobra dela e a manutencao da obrigacao acessoria. Sem isso a tela
       apontava defasagem em centenas de empresas paradas e a fila de ataque
       ficava inutil. */
    e.pisoSemFat = pisoSemFaturamento();
    e.okSemFaturamento = (f.numero === 0 && num(e.honorarioAtual) >= e.pisoSemFat);
    if(e.okSemFaturamento){ e.gapPlano = 0; e.pisoPlano = num(e.honorarioAtual); }
    if(e.naoCobramos){ e.gapPlano = 0; }
  });

  PERIODO_APLICADO = chave;
  return true;
}

function indiceDe(meses, chave, inicio){
  for(var i = 0; i < meses.length; i++){
    if(meses[i] === chave) return i;
    if(inicio && meses[i] > chave) return i;      // janela começa antes da base
  }
  return inicio ? 0 : meses.length - 1;
}

function faixaPorRbt(rbt){
  if(!rbt || rbt <= 0) return {numero:0, rotulo:'Sem faturamento', porte:'Sem faturamento'};
  var tetos = (S.listas.faixas||[]).map(function(f){ return f.limiteSuperior; });
  for(var i = 0; i < tetos.length; i++){
    if(rbt <= tetos[i]) return {numero:i+1, rotulo:(S.listas.faixas[i].rotulo),
      porte: i===0?'Pequeno': i<=2?'Médio': i<=4?'Grande':'Muito grande'};
  }
  return {numero:7, rotulo:'Acima do teto', porte:'Muito grande'};
}

function planoPorFaixa(e, faixaN){
  var t = String(e.tipo || e.segmento || '').toLowerCase();
  var ramo = /com[eé]rcio|varejo|atacad|loja/.test(t) ? 'comercio' : 'servico';
  var planos = S.planos || {};
  if(!planos[ramo] || !planos[ramo].niveis) return {nome:e.planoIndicado||'', piso:num(e.pisoPlano)};
  var idx = faixaN >= 4 ? 2 : faixaN >= 2 ? 1 : 0;
  if(num(e.qtdFuncionarios) > 0 && idx === 0) idx = 1;
  var nv = planos[ramo].niveis[idx];
  return {nome:nv.nome, piso:nv.por};
}

/**
 * Telas que dependem do período garantem a série antes de desenhar.
 * Quem não depende segue direto — não vale pagar a leitura à toa.
 */
function comPeriodo(render){
  if(TELAS_SEM_PERIODO[S.rota] !== undefined){ render(); return; }
  comSeries(function(){
    aplicarPeriodo();
    desenharPeriodo();   // agora sabemos quais competências existem
    render();
  });
}

/* ===========================================================================
   TELA — ADIMPLÊNCIA
   Cruza o que está vencido com faturamento, funcionários e relacionamento,
   e mostra o que de fato é recebido contra o que foi contratado.
   =========================================================================== */
var TITULOS = null;

function telaAdimplencia(){
  // Um título por linha permite recortar por vencimento; o agregado do
  // cadastro não permitia. Carrega uma vez e fica em memória.
  if(!TITULOS){
    document.getElementById('conteudo').innerHTML =
      '<div class="carregando"><div class="giro"></div>Lendo os títulos em aberto…</div>';
    chamar('api_inadimplencia', ['',''], function(res){ TITULOS = res; roteador(); },
      function(){ TITULOS = {titulos:[], porCnpj:{}, competencias:[]}; roteador(); });
    return;
  }
  desenharPeriodo();
  var faixa = faixaConsulta(TITULOS.competencias || []);
  var noIntervalo = (TITULOS.titulos||[]).filter(function(t){
    return (!faixa.de || t.competenciaChave >= faixa.de) &&
           (!faixa.ate || t.competenciaChave <= faixa.ate);
  });
  // agrega por CNPJ dentro da janela escolhida
  var porCnpj = {};
  noIntervalo.forEach(function(t){
    var r = porCnpj[t.cnpj] || (porCnpj[t.cnpj] = {qtd:0, valor:0, maiorAtraso:0});
    r.qtd++; r.valor += num(t.valor);
    if(num(t.diasAtraso) > r.maiorAtraso) r.maiorAtraso = num(t.diasAtraso);
  });

  var emp = ativos().map(function(e){
    var r = porCnpj[e.cnpj];
    return Object.assign({}, e, {
      titulosVencidos: r ? r.qtd : 0,
      valorVencido: r ? Math.round(r.valor*100)/100 : 0,
      maiorAtraso: r ? r.maiorAtraso : 0
    });
  });
  var devedores = emp.filter(function(e){ return num(e.titulosVencidos) > 0; });
  var vencido = devedores.reduce(function(a,e){ return a+num(e.valorVencido); },0);
  var contratado = emp.reduce(function(a,e){ return a+num(e.honorarioAtual); },0);
  var emAtraso = devedores.reduce(function(a,e){ return a+num(e.honorarioAtual); },0);
  var recebido = contratado - emAtraso;

  var faixas = [
    {rot:'Até 30 dias',    min:1,   max:30,   cor:'var(--atencao)'},
    {rot:'31 a 60 dias',   min:31,  max:60,   cor:'var(--alerta)'},
    {rot:'61 a 90 dias',   min:61,  max:90,   cor:'var(--alerta)'},
    {rot:'Acima de 90 dias',min:91, max:99999,cor:'var(--erro)'}
  ];
  faixas.forEach(function(f){
    var lista = devedores.filter(function(e){
      return num(e.maiorAtraso) >= f.min && num(e.maiorAtraso) <= f.max; });
    f.qtd = lista.length;
    f.valor = lista.reduce(function(a,e){ return a+num(e.valorVencido); },0);
  });
  var maxF = Math.max.apply(null, faixas.map(function(f){ return f.valor; })) || 1;

  var ordenados = devedores.slice().sort(function(a,b){
    return num(b.valorVencido) - num(a.valorVencido); });

  document.getElementById('topo-meta').textContent =
    fmtNum(devedores.length)+' clientes · '+fmtNum(noIntervalo.length)+' títulos · '+
    fmtBRL(vencido)+' em aberto · vencimento '+rotuloConsulta(TITULOS.competencias||[]);

  document.getElementById('conteudo').innerHTML =
    '<div class="aviso aviso-info"><span class="aviso-ico">i</span><div>'+
    'Cada título entra pela <b>data de vencimento</b>, então dá para perguntar o que '+
    'venceu em qualquer janela. São '+fmtNum((TITULOS.titulos||[]).length)+' títulos na '+
    'extração do Asaas; '+fmtNum(noIntervalo.length)+' caem em '+
    rotuloConsulta(TITULOS.competencias||[])+'.</div></div>'+

    '<div class="sec"><div class="ind-grade">'+
      indLista('Honorário contratado', fmtCurto(contratado),
        fmtNum(emp.length)+' clientes ativos', '', 'Clientes ativos', emp,
        {subtitulo:'Somam '+fmtBRL(contratado)+' por mês.'})+
      indLista('Recebido estimado', fmtCurto(recebido),
        (contratado?(recebido/contratado*100).toFixed(1):0)+'% do contratado', '',
        'Clientes em dia', emp.filter(function(e){ return !num(e.titulosVencidos); }),
        {subtitulo:'Sem título vencido na última importação.'})+
      indLista('Valor vencido', fmtCurto(vencido), fmtNum(
        devedores.reduce(function(a,e){ return a+num(e.titulosVencidos); },0))+' títulos', 'alerta',
        'Clientes com título vencido', devedores,
        {subtitulo:fmtBRL(vencido)+' em aberto.'})+
      indLista('Clientes inadimplentes', fmtNum(devedores.length),
        (emp.length?(devedores.length/emp.length*100).toFixed(1):0)+'% da carteira', 'laranja',
        'Clientes inadimplentes', devedores)+
      indLista('Acima de 90 dias', fmtNum(devedores.filter(function(e){
          return num(e.maiorAtraso) > 90; }).length),
        'atraso que já virou perda provável', 'alerta',
        'Vencidos há mais de 90 dias',
        devedores.filter(function(e){ return num(e.maiorAtraso) > 90; }),
        {colunas: colunas90(),
         subtitulo:'Maior atraso da carteira: '+fmtNum(Math.max.apply(null,
          devedores.map(function(e){ return num(e.maiorAtraso); }).concat([0])))+' dias. '+
          'A coluna <b>Faturamento 90d</b> mostra o que a empresa declarou nas três últimas '+
          'competências: quem está com <b>R$ 0,00</b> ali provavelmente parou de faturar, e a '+
          'cobrança precisa virar conversa de situação cadastral, não de régua de cobrança.'})+
    '</div></div>'+

    '<div class="sec grade-2">'+
      '<div><div class="sec-tit">Vencido por faixa de atraso</div>'+
        '<div class="cartao" style="padding:16px 18px;">'+
        faixas.map(function(f){
          return '<div class="barra-lin"><span class="barra-rot">'+f.rot+'</span>'+
            '<div class="barra-trilho"><div class="barra-preenche" style="width:'+
            (f.valor/maxF*100).toFixed(1)+'%;background:'+f.cor+'"></div></div>'+
            '<span class="barra-val">'+fmtCurto(f.valor)+'</span>'+
            '<span class="barra-num">'+numClicavel(f.qtd, 'Atraso — '+f.rot,
              devedores.filter(function(e){
                return num(e.maiorAtraso) >= f.min && num(e.maiorAtraso) <= f.max; }),
              {subtitulo:fmtBRL(f.valor)+' vencidos nesta faixa.'})+'</span></div>';
        }).join('')+'</div></div>'+
      '<div><div class="sec-tit">Urgência de cobrança</div>'+
        '<div class="cartao"><div class="kv">'+
        ['Alta','Média','Pequena'].map(function(u){
          var q = devedores.filter(function(e){
            return (e.urgenciaCobranca || urgenciaSugerida(e)) === u; }).length;
          var v = devedores.filter(function(e){
            return (e.urgenciaCobranca || urgenciaSugerida(e)) === u; })
            .reduce(function(a,e){ return a+num(e.valorVencido); },0);
          return '<div><div class="kv-rot">'+u+'</div>'+
            '<div class="kv-val">'+numClicavel(fmtNum(q), 'Urgência '+u,
              devedores.filter(function(e){
                return (e.urgenciaCobranca || urgenciaSugerida(e)) === u; }),
              {subtitulo:fmtBRL(v)+' vencidos neste grupo.'})+'</div>'+
            '<div class="dica">'+fmtBRL(v)+'</div></div>';
        }).join('')+'</div></div>'+
        '<div class="dica" style="margin-top:8px;">Urgência registrada pelo time; '+
        'na falta dela o monitor sugere pelo maior atraso.</div></div>'+
    '</div>'+

    '<div class="sec"><div class="sec-tit">Inadimplentes '+
      '<span class="leve">ordenado por valor vencido</span></div>'+
      '<div class="filtros">'+
        '<input type="search" id="adi-busca" placeholder="Buscar empresa ou CNPJ…">'+
        '<select id="adi-urg"><option value="">Toda urgência</option>'+
          '<option>Alta</option><option>Média</option><option>Pequena</option></select>'+
        selectGrupo('adi-grupo')+
        '<span class="espaco"></span>'+
        '<button class="btn" id="adi-exp">Exportar</button>'+
      '</div>'+
      '<div class="tab-caixa"><table><thead><tr>'+
        '<th>Empresa</th><th>Urgência</th><th>Situação atendimento</th>'+
        '<th>Vencido</th><th>Títulos</th><th>Atraso</th>'+
        '<th>Honorário</th><th>RBT12</th><th>Média/mês</th><th>Fat. 90d</th><th>Func.</th>'+
      '</tr></thead><tbody id="adi-corpo"></tbody></table>'+
      '<div class="paginacao"><span id="adi-cont"></span></div></div>'+
    '</div>';

  function pintar(){
    var termo = (document.getElementById('adi-busca').value||'').toLowerCase().trim();
    var urg = document.getElementById('adi-urg').value;
    var grupo = (document.getElementById('adi-grupo')||{}).value || '';
    var lista = ordenados.filter(function(e){
      if(urg && (e.urgenciaCobranca || urgenciaSugerida(e)) !== urg) return false;
      if(!casaGrupo(e, grupo)) return false;
      if(!termo) return true;
      return casaBusca(e, termo);
    });
    document.getElementById('adi-corpo').innerHTML = lista.slice(0,200).map(function(e){
      var u = e.urgenciaCobranca || urgenciaSugerida(e);
      return '<tr class="clicavel" onclick="location.hash=\'#/empresa/'+e.cnpj+'\'">'+
        '<td><div class="cel-emp"><span class="cel-nome">'+esc(e.empresa)+'</span>'+
        '<span class="cel-cnpj">'+esc(e.cnpjFmt)+'</span></div></td>'+
        '<td>'+(u?'<span class="selo '+(u==='Alta'?'selo-erro':u==='Média'?'selo-alerta':'selo-atencao')+'">'+u+'</span>':'—')+'</td>'+
        '<td style="font-size:12px;">'+esc(e.situacaoAtendimento||'sem registro')+'</td>'+
        '<td class="mono">'+fmtBRL(e.valorVencido)+'</td>'+
        '<td class="mono">'+fmtNum(e.titulosVencidos)+'</td>'+
        '<td class="mono">'+fmtNum(e.maiorAtraso)+'</td>'+
        celHonorario(e)+
        celRbt(e)+ celMedia(e)+
        '<td class="mono'+(num(e.fat90)?'':' fraco')+'">'+(num(e.fat90)?fmtBRL(e.fat90):'sem faturar')+'</td>'+
        '<td class="mono">'+fmtNum(e.qtdFuncionarios)+'</td></tr>';
    }).join('') || '<tr><td colspan="11"><div class="vazio">Nenhum cliente com os filtros atuais.</div></td></tr>';
    document.getElementById('adi-cont').textContent =
      'Mostrando '+Math.min(lista.length,200)+' de '+fmtNum(lista.length);
    document.getElementById('adi-exp').onclick = function(){
      exportar('Adimplencia', 'Adimplência',
        ['CNPJ','Empresa','Urgência','Situação atendimento','Valor vencido','Títulos','Maior atraso','Honorário','RBT12','Média mensal','Faturamento 90d','Funcionários'],
        lista.map(function(e){
          return [e.cnpjFmt, e.empresa, e.urgenciaCobranca || urgenciaSugerida(e) || '',
                  e.situacaoAtendimento||'', num(e.valorVencido), num(e.titulosVencidos),
                  num(e.maiorAtraso), textoHonorario(e), num(e.rbt12), num(e.rbt12)/12,
                  num(e.fat90), num(e.qtdFuncionarios)];
        }), this);
    };
  }
  document.getElementById('adi-busca').addEventListener('input', pintar);
  document.getElementById('adi-urg').addEventListener('change', pintar);
  ligarGrupo('adi-grupo', pintar);
  pintar();
}

/* ===========================================================================
   TELA — SAÚDE FISCAL
   Omissão de declaração e dívida ativa em cliente que fatura pouco: a multa
   come o honorário. É esse cruzamento que a tela mostra.
   =========================================================================== */
function telaSaudeFiscal(){
  // O Diagnóstico Fiscal é publicado por competência. Enquanto houver só uma
  // varredura carregada, o seletor mostra essa e diz que é a única — é mais
  // honesto que oferecer meses que não existem no dado.
  var compsSF = competenciasDaTela();
  desenharPeriodo();
  var emp = ativos();
  var comPend = emp.filter(function(e){ return e.pendenciaFiscal; });
  var custoMulta = num((S.config||{}).custo_multa_estimado) || 200;

  function margem(e){
    // Honorário anual menos o custo estimado das multas do cliente.
    var multas = (e.pendenciaFiscal||'').split(/[,;]+/).filter(function(x){ return x.trim(); }).length || 1;
    return num(e.honorarioAtual)*12 - multas*custoMulta;
  }
  var negativos = comPend.filter(function(e){ return margem(e) <= 0; });
  var semFat = comPend.filter(function(e){ return !num(e.rbt12); });
  var custoTotal = comPend.reduce(function(a,e){
    var multas = (e.pendenciaFiscal||'').split(/[,;]+/).filter(function(x){ return x.trim(); }).length || 1;
    return a + multas*custoMulta; },0);

  var porTipo = {};
  comPend.forEach(function(e){
    (e.pendenciaFiscal||'').split(/[,;]+/).forEach(function(t){
      t = t.trim(); if(!t) return;
      porTipo[t] = (porTipo[t]||0)+1;
    });
  });
  var tipos = Object.keys(porTipo).sort(function(a,b){ return porTipo[b]-porTipo[a]; });
  var maxT = Math.max.apply(null, tipos.map(function(t){ return porTipo[t]; })) || 1;

  var porEquipe = {};
  comPend.forEach(function(e){
    var q = e.equipeFiscal || 'Sem responsável';
    porEquipe[q] = (porEquipe[q]||0)+1;
  });

  var ordenados = comPend.slice().sort(function(a,b){ return margem(a) - margem(b); });

  document.getElementById('topo-meta').textContent =
    fmtNum(comPend.length)+' com pendência fiscal · custo estimado '+fmtBRL(custoTotal)+
    '/ano · competência '+rotuloConsulta(compsSF);

  document.getElementById('conteudo').innerHTML =
    '<div class="aviso aviso-atencao"><span class="aviso-ico">!</span><div>'+
    '<b>'+fmtNum(negativos.length)+' clientes</b> têm custo de multa maior que o honorário anual — '+
    'nesses a Exemplo paga para trabalhar. O custo por multa está em '+fmtBRL(custoMulta)+
    ' e é ajustável em <a href="#/parametros">Parâmetros do ano</a>.</div></div>'+

    '<div class="sec"><div class="ind-grade">'+
      indLista('Com pendência fiscal', fmtNum(comPend.length),
        (emp.length?(comPend.length/emp.length*100).toFixed(1):0)+'% da carteira', 'laranja',
        'Clientes com pendência fiscal', comPend)+
      indLista('Margem negativa', fmtNum(negativos.length),
        'multa supera o honorário anual', 'alerta',
        'Margem negativa — pagamos para trabalhar', negativos,
        {subtitulo:'O custo estimado das multas passa o honorário de um ano inteiro.'})+
      indLista('Pendência sem faturar', fmtNum(semFat.length),
        'RBT12 zerado e com multa', 'alerta',
        'Com pendência e sem faturamento', semFat)+
      indLista('Custo estimado/ano', fmtCurto(custoTotal),
        fmtBRL(custoMulta)+' por pendência', 'alerta',
        'Clientes que geram esse custo', comPend,
        {subtitulo:'Total de '+fmtBRL(custoTotal)+' ao ano, a '+fmtBRL(custoMulta)+' por pendência.'})+
      indLista('Honorário exposto', fmtCurto(negativos.reduce(function(a,e){
          return a+num(e.honorarioAtual); },0)), 'nos clientes de margem negativa', '',
        'Honorário em risco', negativos)+
    '</div></div>'+

    '<div class="sec grade-2">'+
      '<div><div class="sec-tit">Tipo de pendência</div>'+
        '<div class="cartao" style="padding:16px 18px;">'+ (tipos.length ?
        tipos.map(function(t){
          return '<div class="barra-lin"><span class="barra-rot">'+esc(t)+'</span>'+
            '<div class="barra-trilho"><div class="barra-preenche" style="width:'+
            (porTipo[t]/maxT*100).toFixed(1)+'%;background:var(--alerta)"></div></div>'+
            '<span class="barra-num">'+numClicavel(porTipo[t], 'Pendência — '+t,
              comPend.filter(function(e){ return (e.pendenciaFiscal||'').indexOf(t) >= 0; }))+
            '</span></div>';
        }).join('') : '<div class="vazio">Nenhuma pendência registrada na base.</div>')+'</div></div>'+
      '<div><div class="sec-tit">Por equipe fiscal</div>'+
        '<div class="cartao"><div class="kv">'+
        Object.keys(porEquipe).sort(function(a,b){ return porEquipe[b]-porEquipe[a]; })
          .slice(0,8).map(function(q){
          return '<div><div class="kv-rot">'+esc(q)+'</div>'+
            '<div class="kv-val">'+numClicavel(porEquipe[q], 'Equipe fiscal — '+q,
              comPend.filter(function(e){ return (e.equipeFiscal||'Sem responsável')===q; }))+
            '</div></div>';
        }).join('')+'</div></div></div>'+
    '</div>'+

    '<div class="sec"><div class="sec-tit">Clientes com pendência '+
      '<span class="leve">pior margem primeiro</span></div>'+
      '<div class="filtros">'+
        '<input type="search" id="sf-busca" placeholder="Buscar empresa ou CNPJ…">'+
        '<select id="sf-tipo"><option value="">Toda pendência</option>'+
          tipos.map(function(t){ return '<option>'+esc(t)+'</option>'; }).join('')+'</select>'+
        selectGrupo('sf-grupo')+
        '<label class="chk"><input type="checkbox" id="sf-neg"> só margem negativa</label>'+
        '<span class="espaco"></span>'+
        '<button class="btn" id="sf-exp">Exportar</button>'+
      '</div>'+
      '<div class="tab-caixa"><table><thead><tr>'+
        '<th>Empresa</th><th>Pendência</th><th>Equipe</th>'+
        '<th>RBT12</th><th>Média/mês</th><th>Honorário/ano</th><th>Custo multa</th><th>Margem</th>'+
      '</tr></thead><tbody id="sf-corpo"></tbody></table>'+
      '<div class="paginacao"><span id="sf-cont"></span></div></div>'+
    '</div>';

  function pintar(){
    var termo = (document.getElementById('sf-busca').value||'').toLowerCase().trim();
    var tipo = document.getElementById('sf-tipo').value;
    var soNeg = document.getElementById('sf-neg').checked;
    var grupo = (document.getElementById('sf-grupo')||{}).value || '';
    var lista = ordenados.filter(function(e){
      if(soNeg && margem(e) > 0) return false;
      if(!casaGrupo(e, grupo)) return false;
      if(tipo && (e.pendenciaFiscal||'').indexOf(tipo) < 0) return false;
      if(!termo) return true;
      return casaBusca(e, termo);
    });
    document.getElementById('sf-corpo').innerHTML = lista.slice(0,200).map(function(e){
      var multas = (e.pendenciaFiscal||'').split(/[,;]+/).filter(function(x){ return x.trim(); }).length || 1;
      var mg = margem(e);
      return '<tr class="clicavel" onclick="location.hash=\'#/empresa/'+e.cnpj+'\'">'+
        '<td><div class="cel-emp"><span class="cel-nome">'+esc(e.empresa)+'</span>'+
        '<span class="cel-cnpj">'+esc(e.cnpjFmt)+'</span></div></td>'+
        '<td><span class="selo selo-alerta">'+esc(e.pendenciaFiscal)+'</span></td>'+
        '<td style="font-size:12px;">'+esc(e.equipeFiscal||'—')+'</td>'+
        celRbt(e)+ celMedia(e)+
        '<td class="mono">'+fmtBRL(num(e.honorarioAtual)*12)+'</td>'+
        '<td class="mono">'+fmtBRL(multas*custoMulta)+'</td>'+
        '<td class="mono" style="color:'+(mg<=0?'var(--erro)':'var(--ok)')+';font-weight:700;">'+
        fmtBRL(mg)+'</td></tr>';
    }).join('') || '<tr><td colspan="8"><div class="vazio">Nenhum cliente com os filtros atuais.</div></td></tr>';
    document.getElementById('sf-cont').textContent =
      'Mostrando '+Math.min(lista.length,200)+' de '+fmtNum(lista.length);
    document.getElementById('sf-exp').onclick = function(){
      exportar('Saude_Fiscal', 'Saúde fiscal',
        ['CNPJ','Empresa','Pendência','Equipe fiscal','RBT12','Média mensal','Honorário anual','Custo multa','Margem'],
        lista.map(function(e){
          var multas = (e.pendenciaFiscal||'').split(/[,;]+/).filter(function(x){ return x.trim(); }).length || 1;
          return [e.cnpjFmt, e.empresa, e.pendenciaFiscal, e.equipeFiscal||'',
                  num(e.rbt12), num(e.rbt12)/12, num(e.honorarioAtual)*12, multas*custoMulta, margem(e)];
        }), this);
    };
  }
  document.getElementById('sf-busca').addEventListener('input', pintar);
  document.getElementById('sf-tipo').addEventListener('change', pintar);
  document.getElementById('sf-neg').addEventListener('change', pintar);
  ligarGrupo('sf-grupo', pintar);
  pintar();
}

/* ===========================================================================
   TELA — NOTAS EMITIDAS PELA EXEMPLO
   Quantas notas saem por mês, para quem, e quanto do faturamento do cliente
   passa pela nossa emissão — cruzado com o honorário cobrado.
   =========================================================================== */

/* ===========================================================================
   TELA — HISTÓRICO DE FATURAMENTO (3 ANOS)
   Faturamento, notas, funcionários e honorário lado a lado por ano, para
   responder "cresceu e a gente reajustou?" — e registrar a justificativa
   quando não reajustamos.
   =========================================================================== */
function telaHistorico(){
  comSeries(function(){
    if(!NOTAS_ANO){ carregarNotasAno(function(){ roteador(); }); }
    var emp = ativos();
    var anos = (SERIES.anos||[]).slice(-3);
    if(!anos.length){
      document.getElementById('conteudo').innerHTML =
        '<div class="vazio"><div class="vazio-ico">▤</div>Sem histórico mensal na planilha.'+
        '<div class="dica" style="margin-top:6px;">Importe o demonstrativo de faturamento na aba HISTORICO.</div></div>';
      return;
    }
    var ultimo = anos[anos.length-1], primeiro = anos[0];

    var linhas = emp.map(function(e){
      var porAno = {};
      anos.forEach(function(a){ porAno[a] = anoDaEmpresa(e.cnpj, a); });
      var ini = porAno[primeiro].fat, fim = porAno[ultimo].fat;
      return {
        e: e, porAno: porAno,
        cresc: (ini > 0 && fim > 0) ? (fim - ini)/ini : null,
        semReajuste: !e.dataUltimoReajuste
      };
    });

    var cresceram = linhas.filter(function(x){ return x.cresc !== null && x.cresc >= 0.30; });
    var cresceuSemReajuste = cresceram.filter(function(x){
      return x.semReajuste || num(x.e.mesesSemReajuste) >= 24; });
    var encolheram = linhas.filter(function(x){ return x.cresc !== null && x.cresc <= -0.20; });

    var totalPorAno = {};
    anos.forEach(function(a){
      totalPorAno[a] = linhas.reduce(function(s,x){ return s + x.porAno[a].fat; }, 0);
    });
    var maxAno = Math.max.apply(null, anos.map(function(a){ return totalPorAno[a]; })) || 1;

    var ordenados = linhas.filter(function(x){ return x.cresc !== null; })
      .sort(function(a,b){ return b.cresc - a.cresc; });

    document.getElementById('topo-meta').textContent =
      anos.join(' · ')+' · '+fmtNum(cresceram.length)+' cresceram 30% ou mais';

    document.getElementById('conteudo').innerHTML =
      '<div class="aviso aviso-atencao"><span class="aviso-ico">!</span><div>'+
      '<b>'+fmtNum(cresceuSemReajuste.length)+' clientes</b> cresceram 30% ou mais de '+primeiro+
      ' a '+ultimo+' e estão há 24 meses ou mais sem reajuste registrado. '+
      'Abra a empresa e registre a tratativa — inclusive a justificativa, quando o reajuste '+
      'não for aplicado.</div></div>'+

      '<div class="sec"><div class="ind-grade">'+
        indLista('Faturamento '+ultimo, fmtCurto(totalPorAno[ultimo]), 'soma da carteira', '',
          'Quem faturou em '+ultimo,
          ordenados.filter(function(x){ return num((x.porAno[ultimo]||{}).fat) > 0; })
                   .map(function(x){ return x.e; }),
          {subtitulo:'Soma de '+fmtBRL(totalPorAno[ultimo])+' declarada em '+ultimo+'.'})+
        indLista('Variação '+primeiro+'→'+ultimo,
            totalPorAno[primeiro] ? fmtPct((totalPorAno[ultimo]-totalPorAno[primeiro])/totalPorAno[primeiro],1) : '—',
            'carteira inteira', '',
            'Quem puxou a variação (maior crescimento)',
            ordenados.slice().sort(function(a,b){ return (b.cresc||0)-(a.cresc||0); })
                     .map(function(x){ return x.e; }),
            {subtitulo:'Ordenado pelo crescimento de '+primeiro+' a '+ultimo+
             '. A variação da carteira é a soma, não a média das empresas.'})+
        indLista('Cresceram 30%+', fmtNum(cresceram.length),
          'candidatos a reajuste', 'laranja', 'Cresceram 30% ou mais',
          cresceram.map(function(x){ return x.e; }),
          {subtitulo:'De '+primeiro+' a '+ultimo+'.'})+
        indLista('Cresceram sem reajuste', fmtNum(cresceuSemReajuste.length),
          'crescimento sem contrapartida', 'alerta', 'Cresceram e não reajustamos',
          cresceuSemReajuste.map(function(x){ return x.e; }),
          {subtitulo:'Cresceram 30%+ e estão há 24 meses ou mais sem reajuste registrado.'})+
        indLista('Encolheram 20%+', fmtNum(encolheram.length),
          'avaliar risco de saída', 'neutro', 'Encolheram 20% ou mais',
          encolheram.map(function(x){ return x.e; }))+
      '</div></div>'+

      '<div class="sec grade-2">'+
        '<div><div class="sec-tit">Faturamento da carteira por ano</div>'+
          '<div class="cartao" style="padding:16px 18px;">'+
          anos.map(function(a){
            return '<div class="barra-lin"><span class="barra-rot">'+a+'</span>'+
              '<div class="barra-trilho"><div class="barra-preenche" style="width:'+
              (totalPorAno[a]/maxAno*100).toFixed(1)+'%"></div></div>'+
              '<span class="barra-val">'+fmtCurto(totalPorAno[a])+'</span></div>';
          }).join('')+'</div>'+
          '<div class="dica" style="margin-top:8px;">Anos parciais aparecem menores: '+
          ultimo+' só tem os meses já fechados.</div></div>'+
        '<div><div class="sec-tit">Notas emitidas por ano</div>'+
          '<div class="cartao"><div class="kv">'+
          anos.map(function(a){
            var q = linhas.reduce(function(s,x){ return s + (notasAno(x.e.cnpj, a)||0); },0);
            var v = linhas.reduce(function(s,x){ return s + (notasValorAno(x.e.cnpj, a)||0); },0);
            return '<div><div class="kv-rot">'+a+'</div>'+
              '<div class="kv-val mono">'+fmtNum(q)+'</div>'+
              '<div class="dica">'+fmtBRL(v)+'</div></div>';
          }).join('')+'</div></div></div>'+
      '</div>'+

      '<div class="sec"><div class="sec-tit">Histórico por cliente '+
        '<span class="leve">maior crescimento primeiro</span></div>'+
        '<div class="filtros">'+
          '<input type="search" id="hi-busca" placeholder="Buscar empresa ou CNPJ…">'+
          selectGrupo('hi-grupo')+
          '<select id="hi-fil"><option value="">Todos</option>'+
            '<option value="cresceu">Cresceram 30%+</option>'+
            '<option value="semreaj">Cresceram e não reajustamos</option>'+
            '<option value="caiu">Encolheram 20%+</option></select>'+
          '<span class="espaco"></span>'+
          '<button class="btn" id="hi-exp">Exportar</button>'+
        '</div>'+
        '<div class="tab-caixa"><table><thead><tr>'+
          '<th>Empresa</th>'+
          anos.map(function(a){ return '<th>Fat. '+a+'</th>'; }).join('')+
          '<th>Variação</th><th>Notas '+ultimo+'</th><th>Func.</th>'+
          '<th>Honorário</th><th>Últ. reajuste</th>'+
        '</tr></thead><tbody id="hi-corpo"></tbody></table>'+
        '<div class="paginacao"><span id="hi-cont"></span></div></div>'+
      '</div>';

    function pintar(){
      var termo = (document.getElementById('hi-busca').value||'').toLowerCase().trim();
      var fil = document.getElementById('hi-fil').value;
      var grupo = (document.getElementById('hi-grupo')||{}).value || '';
      var lista = ordenados.filter(function(x){
        if(!casaGrupo(x.e, grupo)) return false;
        if(fil === 'cresceu' && !(x.cresc >= 0.30)) return false;
        if(fil === 'semreaj' && !(x.cresc >= 0.30 && (x.semReajuste || num(x.e.mesesSemReajuste) >= 24))) return false;
        if(fil === 'caiu' && !(x.cresc <= -0.20)) return false;
        if(!termo) return true;
        return casaBusca(x.e, termo);
      });
      document.getElementById('hi-corpo').innerHTML = lista.slice(0,200).map(function(x){
        var e = x.e;
        var cor = x.cresc >= 0.30 ? 'var(--ok)' : x.cresc <= -0.20 ? 'var(--erro)' : 'inherit';
        return '<tr class="clicavel" onclick="location.hash=\'#/empresa/'+e.cnpj+'\'">'+
          '<td><div class="cel-emp"><span class="cel-nome">'+esc(e.empresa)+'</span>'+
          '<span class="cel-cnpj">'+esc(e.cnpjFmt)+'</span></div></td>'+
          anos.map(function(a){
            return '<td class="mono"><button type="button" class="num-link" '+
              'onclick="event.stopPropagation();detalharAno(\''+e.cnpj+'\',\''+a+'\')" '+
              'title="Ver mês a mês de '+a+'">'+fmtCurto(x.porAno[a].fat)+'</button></td>'; }).join('')+
          '<td class="mono" style="color:'+cor+';font-weight:700;">'+fmtPct(x.cresc,1)+'</td>'+
          '<td class="mono">'+(notasAno(e.cnpj, ultimo)===null
            ? '<span class="fraco">—</span>' : fmtNum(notasAno(e.cnpj, ultimo)))+'</td>'+
          '<td class="mono">'+fmtNum(x.porAno[ultimo].func)+'</td>'+
          '<td class="mono">'+fmtBRL(e.honorarioAtual)+'</td>'+
          '<td class="mono" style="font-size:11.5px;">'+
          (e.dataUltimoReajuste ? fmtData(e.dataUltimoReajuste)
            : '<span class="selo selo-atencao">sem registro</span>')+'</td></tr>';
      }).join('') || '<tr><td colspan="'+(anos.length+6)+'"><div class="vazio">Nenhuma empresa com os filtros atuais.</div></td></tr>';
      document.getElementById('hi-cont').textContent =
        'Mostrando '+Math.min(lista.length,200)+' de '+fmtNum(lista.length);
      document.getElementById('hi-exp').onclick = function(){
        exportar('Historico_'+primeiro+'_'+ultimo, 'Histórico',
          ['CNPJ','Empresa'].concat(anos.map(function(a){ return 'Faturamento '+a; }))
            .concat(['Variação %','Notas '+ultimo,'Funcionários','Honorário','Último reajuste']),
          lista.map(function(x){
            return [x.e.cnpjFmt, x.e.empresa]
              .concat(anos.map(function(a){ return x.porAno[a].fat; }))
              .concat([Number((x.cresc*100).toFixed(2)), x.porAno[ultimo].notasQtd,
                       x.porAno[ultimo].func, num(x.e.honorarioAtual),
                       x.e.dataUltimoReajuste || '']);
          }), this);
      };
    }
    document.getElementById('hi-busca').addEventListener('input', pintar);
    document.getElementById('hi-fil').addEventListener('change', pintar);
    ligarGrupo('hi-grupo', pintar);
    pintar();
  });
}

/**
 * Mês a mês de um ano de um cliente. O total do ano some a diferença entre
 * "cresceu o ano todo" e "teve um mês fora da curva" — e é essa diferença que
 * decide se o reajuste se sustenta numa conversa com o cliente.
 * A série vem de api_carregarEmpresa, que já devolve a competência completa.
 */
function detalharAno(cnpj, ano){
  var e = S.porCnpj[cnpj];
  if(!e) return;
  abrirModal(e.empresa+' — '+ano,
    '<div class="carregando"><div class="giro"></div>Lendo o histórico mensal…</div>', [], true);
  chamar('api_carregarEmpresa', [cnpj], function(res){
    var serie = (res.serie||[]).filter(function(x){ return String(x.competencia).slice(0,4) === String(ano); });
    var corpo = document.getElementById('modal-corpo');
    if(!corpo) return;
    if(!serie.length){
      corpo.innerHTML = '<div class="vazio"><div class="vazio-ico">▤</div>'+
        'Sem competências de '+esc(ano)+' na aba HISTORICO para este cliente.</div>';
      return;
    }
    var total = serie.reduce(function(a,x){ return a+num(x.faturamento); },0);
    var media = total/serie.length;
    var maxV = Math.max.apply(null, serie.map(function(x){ return num(x.faturamento); }).concat([1]));
    var pico = serie.reduce(function(a,x){ return num(x.faturamento)>num(a.faturamento)?x:a; }, serie[0]);
    var vale = serie.reduce(function(a,x){ return num(x.faturamento)<num(a.faturamento)?x:a; }, serie[0]);

    corpo.innerHTML =
      '<div class="ind-grade" style="margin-bottom:14px;">'+
        ind('Total do ano', fmtCurto(total), fmtNum(serie.length)+' competências')+
        ind('Média mensal', fmtCurto(media), '')+
        ind('Melhor mês', fmtCurto(pico.faturamento), esc(pico.competenciaDisplay))+
        ind('Pior mês', fmtCurto(vale.faturamento), esc(vale.competenciaDisplay), 'neutro')+
      '</div>'+
      '<div class="tab-caixa" style="max-height:44vh;overflow:auto;"><table>'+
      '<thead><tr><th>Competência</th><th></th><th class="num">Faturamento</th>'+
      '<th class="num">vs. média</th><th class="num">Notas</th><th class="num">Func.</th></tr></thead><tbody>'+
      serie.map(function(x){
        var v = num(x.faturamento);
        var dif = media ? (v-media)/media : 0;
        return '<tr><td style="font-weight:600;">'+esc(x.competenciaDisplay)+'</td>'+
          '<td style="width:34%;"><div class="barra-trilho"><div class="barra-preenche" style="width:'+
          (v/maxV*100).toFixed(1)+'%"></div></div></td>'+
          '<td class="mono">'+fmtBRL(v)+'</td>'+
          '<td class="mono" style="color:'+(dif>=0?'var(--ok)':'var(--erro)')+';">'+fmtPct(dif,0)+'</td>'+
          '<td class="mono">'+(x.notas===null?'—':fmtNum(x.notas))+'</td>'+
          '<td class="mono">'+(x.funcionarios===null?'—':fmtNum(x.funcionarios))+'</td></tr>';
      }).join('')+'</tbody></table></div>'+
      '<div class="acoes" style="margin-top:12px;">'+

/* ===========================================================================
   TELA — GRUPOS EMPRESARIAIS
   ---------------------------------------------------------------------------
   Pedido da diretoria: saber quanto cada GRUPO paga, não cada CNPJ. A conversa de
   reajuste sempre acontece com a pessoa que decide pelo grupo inteiro, e até
   aqui o monitor só sabia falar de CNPJ isolado — dava para propor +R$ 300 numa
   filial sem enxergar que o mesmo dono já paga R$ 4.200 em outras seis.

   O agrupamento é pela RAIZ DO CNPJ (8 primeiros dígitos), que é o vínculo
   societário que a Receita garante. Grupos por sócio em comum exigiriam QSA,
   que não temos — quando isso entrar, é só trocar a chave aqui.
   =========================================================================== */
function montarGrupos(){
  var mapa = {};
  ativos().forEach(function(e){
    var k = chaveGrupo(e);
    if(!mapa[k]) mapa[k] = {chave:k, nomeado:grupoNomeado(e),
                            raiz:e.grupoEmpresarial || (e.grupoRaiz || String(e.cnpj||'').slice(0,8)),
                            empresas:[], honorario:0, rbt12:0, fatPeriodo:0,
                            vencido:0, titulos:0, gap:0, semHonorario:0, semFat:0, acordo:0};
    var g = mapa[k];
    g.empresas.push(e);
    g.honorario += num(e.honorarioAtual);
    g.rbt12 += num(e.rbt12);
    g.fatPeriodo += num(e.fatPeriodo);
    g.vencido += num(e.valorVencido);
    g.titulos += num(e.titulosVencidos);
    g.gap += num(e.gapPlano);
    if(e.naoCobramos) g.acordo++;
    else if(!num(e.honorarioAtual)) g.semHonorario++;
    if(!num(e.rbt12)) g.semFat++;
  });
  return Object.keys(mapa).map(function(k){
    var g = mapa[k];
    // Grupo nomeado usa o nome do Tabelão. Grupo por raiz não tem nome: usa o
    // da matriz e, sem matriz marcada, o da empresa de maior faturamento.
    var matriz = g.empresas.filter(function(e){ return e.matrizFilial === 'Matriz'; })[0];
    var cabeca = matriz || g.empresas.slice().sort(function(a,b){
      return num(b.rbt12) - num(a.rbt12) || num(b.honorarioAtual) - num(a.honorarioAtual); })[0];
    g.nome = g.nomeado ? g.raiz : (cabeca ? cabeca.empresa : g.raiz);
    g.origem = g.nomeado ? 'Tabelão' : 'raiz do CNPJ';
    g.matriz = matriz || null;
    g.qtd = g.empresas.length;
    g.media = g.qtd ? g.honorario / g.qtd : 0;
    g.pctFat = g.rbt12 ? (g.honorario * 12) / g.rbt12 : null;
    return g;
  });
}

/* ===========================================================================
   TELA — RESULTADO DA CARTEIRA
   ---------------------------------------------------------------------------
   Pedido da diretoria: "ter controle dos clientes que saíram, entraram ou pediram
   reajuste, ter esse histórico, e se o mês foi positivo ou não".

   Até aqui o monitor só sabia o ESTADO da carteira (quem está dentro, quanto
   paga). Não sabia o MOVIMENTO — e é o movimento que responde se o mês foi bom.
   Um mês com 30 entradas parece ótimo até se ver que saíram 25 clientes que
   pagavam o dobro.

   Por isso o resultado do mês soma quatro coisas no mesmo eixo de R$/mês:
       + entradas          honorário contratado de quem entrou
       − saídas            honorário que ia embora com quem saiu
       + reajustes         diferença dos honorários aumentados
       − reduções          diferença dos honorários reduzidos
   O saldo é o que a carteira ganhou ou perdeu de receita RECORRENTE naquele
   mês. Positivo = o mês foi positivo. Sem isso, "entraram 30 clientes" é um
   número de vaidade.

   Fonte: aba MOVIMENTO_CARTEIRA (entradas/saídas) + MOVIMENTO_HONORARIOS
   (reajustes/reduções), alimentadas pela planilha "Empresas Novas".
   =========================================================================== */
var MOVIMENTO = null;

/**
 * Valor mensal de um movimento, SEMPRE como grandeza positiva.
 * A planilha registra parte das saídas com sinal negativo e parte sem — quem
 * digitou usou as duas convenções (88 de 125 vieram negativas). Somar como
 * está dava saldo invertido: uma saída de R$ 607 virava ganho. Aqui o sinal
 * fica a cargo da CONTA — entrada soma, saída subtrai —, nunca do dado.
 */
function valorMov(m){
  return Math.abs(num(m.valorCobrado) || num(m.valorContrato));
}

function telaResultado(){
  if(!MOVIMENTO){
    document.getElementById('conteudo').innerHTML =
      '<div class="carregando"><div class="giro"></div>Lendo o movimento da carteira…</div>';
    chamar('api_resultadoCarteira', [], function(res){ MOVIMENTO = res; roteador(); },
      function(){ MOVIMENTO = {movimentos:[], honorarios:[], meses:[]}; roteador(); });
    return;
  }

  var p = periodoAtual();
  function dentro(m){ return m && m >= p.de && m <= p.ate; }

  var movs = (MOVIMENTO.movimentos||[]).filter(function(m){ return dentro(m.mes); });
  var hons = (MOVIMENTO.honorarios||[]).filter(function(h){ return dentro(h.mes); });

  var entradas  = movs.filter(function(m){ return /entrada/i.test(m.tipo); });
  var saidas    = movs.filter(function(m){ return /sa[ií]da/i.test(m.tipo); });
  /* Reajuste e redução são excludentes: o Tipo manda, e só quando ele vem
     vazio o sinal da diferença decide. Deixar os dois testes soltos fazia uma
     linha de "Reajuste" com diferença negativa ser contada nas duas pontas. */
  function ehReajuste(h){
    if(/reajust|aument/i.test(h.tipo)) return true;
    if(/redu|desconto/i.test(h.tipo)) return false;
    return num(h.diferenca) >= 0;
  }
  var reajustes = hons.filter(ehReajuste);
  var reducoes  = hons.filter(function(h){ return !ehReajuste(h); });

  function soma(l, f){ return l.reduce(function(a,x){ return a+f(x); },0); }
  var vEnt = soma(entradas, valorMov);
  var vSai = soma(saidas,   valorMov);
  var vRea = soma(reajustes, function(h){ return Math.abs(num(h.diferenca)); });
  var vRed = soma(reducoes,  function(h){ return -Math.abs(num(h.diferenca)); });
  var saldo = vEnt - vSai + vRea + vRed;

  /* Resultado mês a mês. A chave é a competência do movimento, não a data do
     contrato: o que muda a receita é o mês em que a cobrança passa a valer. */
  var porMes = {};
  function bucket(m){
    if(!porMes[m]) porMes[m] = {mes:m, ent:0, vEnt:0, sai:0, vSai:0, rea:0, vRea:0,
                                red:0, vRed:0, lEnt:[], lSai:[], lRea:[], lRed:[]};
    return porMes[m];
  }
  entradas.forEach(function(m){ var b=bucket(m.mes); b.ent++; b.vEnt += valorMov(m); b.lEnt.push(m); });
  saidas.forEach(function(m){   var b=bucket(m.mes); b.sai++; b.vSai += valorMov(m); b.lSai.push(m); });
  reajustes.forEach(function(h){ var b=bucket(h.mes); b.rea++; b.vRea += Math.abs(num(h.diferenca)); b.lRea.push(h); });
  reducoes.forEach(function(h){  var b=bucket(h.mes); b.red++; b.vRed -= Math.abs(num(h.diferenca)); b.lRed.push(h); });

  var meses = Object.keys(porMes).sort();
  meses.forEach(function(m){
    var b = porMes[m];
    b.saldo = b.vEnt - b.vSai + b.vRea + b.vRed;
    b.liquido = b.ent - b.sai;
  });
  var positivos = meses.filter(function(m){ return porMes[m].saldo > 0; });
  var negativos = meses.filter(function(m){ return porMes[m].saldo < 0; });
  var maxAbs = Math.max.apply(null, meses.map(function(m){ return Math.abs(porMes[m].saldo); }).concat([1]));

  /* Motivo da saída vem da coluna Situação: é o que permite separar o cliente
     que fechou a empresa (nada a fazer) do que saiu por inadimplência ou por
     preço (tem tratativa possível). */
  var porMotivo = {};
  saidas.forEach(function(m){
    var k = m.situacao || 'Sem motivo registrado';
    if(!porMotivo[k]) porMotivo[k] = {qtd:0, valor:0, lista:[]};
    porMotivo[k].qtd++; porMotivo[k].valor += valorMov(m);
    porMotivo[k].lista.push(m);
  });
  var motivos = Object.keys(porMotivo).sort(function(a,b){ return porMotivo[b].valor - porMotivo[a].valor; });
  var maxMot = Math.max.apply(null, motivos.map(function(k){ return porMotivo[k].valor; }).concat([1]));

  document.getElementById('topo-meta').textContent =
    fmtNum(entradas.length)+' entradas · '+fmtNum(saidas.length)+' saídas · saldo '+
    fmtBRL(saldo)+'/mês · '+rotuloConsulta(MOVIMENTO.meses||[]);

  document.getElementById('conteudo').innerHTML =
    '<div class="aviso '+(saldo>=0?'aviso-ok':'aviso-erro')+'"><span class="aviso-ico">'+
      (saldo>=0?'↑':'↓')+'</span><div>'+
      'No período escolhido a carteira '+(saldo>=0?'<b>ganhou</b>':'<b>perdeu</b>')+' '+
      '<b>'+fmtBRL(Math.abs(saldo))+' por mês</b> de receita recorrente — entradas '+
      fmtBRL(vEnt)+', saídas −'+fmtBRL(vSai)+', reajustes +'+fmtBRL(vRea)+', reduções −'+
      fmtBRL(Math.abs(vRed))+'. Em doze meses isso é '+fmtBRL(Math.abs(saldo)*12)+'.'+
    '</div></div>'+

    '<div class="sec"><div class="ind-grade">'+
      indMov('Entradas', fmtNum(entradas.length), fmtBRL(vEnt)+'/mês contratados', '',
        'Clientes que entraram', entradas, colunasMovimento())+
      indMov('Saídas', fmtNum(saidas.length), '−'+fmtBRL(vSai)+'/mês que saíram', 'alerta',
        'Clientes que saíram', saidas, colunasMovimento())+
      indMov('Reajustes', fmtNum(reajustes.length), '+'+fmtBRL(vRea)+'/mês', '',
        'Honorários reajustados', reajustes, colunasHonorario())+
      indMov('Reduções', fmtNum(reducoes.length), '−'+fmtBRL(Math.abs(vRed))+'/mês', 'laranja',
        'Honorários reduzidos', reducoes, colunasHonorario())+
      indMov('Saldo líquido', fmtBRL(saldo), (saldo>=0?'ganho':'perda')+' de receita recorrente',
        saldo>=0?'':'alerta',
        'Tudo que mexeu na receita no período',
        entradas.concat(saidas), colunasMovimento())+
      indMov('Saldo de CNPJs', (entradas.length-saidas.length>0?'+':'')+fmtNum(entradas.length-saidas.length),
        fmtNum(positivos.length)+' meses positivos · '+fmtNum(negativos.length)+' negativos',
        (entradas.length-saidas.length)>=0?'':'alerta',
        'Entradas e saídas do período', entradas.concat(saidas), colunasMovimento())+
    '</div></div>'+

    '<div class="sec"><div class="sec-tit">Resultado mês a mês '+
      '<span class="leve">clique nos números para ver quem entrou, saiu ou mudou de honorário</span></div>'+
      '<div class="tab-caixa"><table><thead><tr>'+
        '<th>Mês</th><th class="num">Entradas</th><th class="num">R$ entradas</th>'+
        '<th class="num">Saídas</th><th class="num">R$ saídas</th>'+
        '<th class="num">Reajustes</th><th class="num">Reduções</th>'+
        '<th class="num">Saldo do mês</th><th style="width:20%;"></th><th>Resultado</th>'+
      '</tr></thead><tbody>'+
      (meses.length ? meses.map(function(m){
        var b = porMes[m];
        var pos = b.saldo >= 0;
        return '<tr>'+
          '<td style="font-weight:700;">'+esc(compDisplay(m))+'</td>'+
          '<td class="mono">'+numMov(b.ent, 'Entradas em '+compDisplay(m), b.lEnt, colunasMovimento())+'</td>'+
          '<td class="mono">'+fmtBRL(b.vEnt)+'</td>'+
          '<td class="mono">'+numMov(b.sai, 'Saídas em '+compDisplay(m), b.lSai, colunasMovimento())+'</td>'+
          '<td class="mono" style="color:var(--erro);">'+(b.vSai?'−'+fmtBRL(b.vSai):fmtBRL(0))+'</td>'+
          '<td class="mono">'+(b.rea?numMov(b.rea,'Reajustes em '+compDisplay(m),b.lRea,colunasHonorario())+
