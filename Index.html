    '</div>'+
    '<div id="e-resumo"></div>'+
    '<div class="tab-caixa" id="e-tabela"></div>'+
    '<div class="paginacao" id="e-pag"></div>';

  function aplicar(){
    var busca = document.getElementById('e-busca').value.trim().toLowerCase();
    var faixa = document.getElementById('e-faixa').value;
    var ramo = document.getElementById('e-ramo').value;
    var prio = document.getElementById('e-prio').value;
    var gap = document.getElementById('e-gap').value;
    var grupo = document.getElementById('e-grupo').value;
    var soAtivos = document.getElementById('e-ativos').checked;

    var l = S.empresas.filter(function(e){
      if(soAtivos && e.saiu) return false;
      if(faixa && faixaDe(e)!==faixa) return false;
      if(ramo && e.ramo!==ramo) return false;
      if(prio && e.prioridade!==prio) return false;
      if(!casaGrupo(e, grupo)) return false;
      if(gap==='sim' && !(num(e.gapHonorario)>0)) return false;
      if(gap==='nao' && (e.honorarioAtual===null || num(e.gapHonorario)>0)) return false;
      if(gap==='sem' && e.honorarioAtual!==null) return false;
      if(busca && !casaBusca(e, busca)) return false;
      return true;
    }).sort(function(a,b){ return (a.empresa||'').localeCompare(b.empresa||'','pt-BR'); });

    listaAtual = l;
    var defasadas = l.filter(function(e){ return num(e.gapHonorario)>0; });
    var somaGap = defasadas.reduce(function(a,e){ return a+num(e.gapHonorario); },0);
    document.getElementById('e-resumo').innerHTML = l.length ?
      '<div class="aviso aviso-info"><span class="aviso-ico">i</span><div>'+
      '<b>'+fmtNum(l.length)+'</b> empresa(s) no recorte · <b>'+fmtNum(defasadas.length)+
      '</b> abaixo da régua'+(somaGap?' (potencial de <b>'+fmtCurto(somaGap)+'/mês</b>)':'')+
      '</div></div>' : '';

    var totalPag = Math.max(1, Math.ceil(l.length/porPagina));
    pagina = Math.min(pagina, totalPag-1);
    var fatia = l.slice(pagina*porPagina, pagina*porPagina+porPagina);

    document.getElementById('e-tabela').innerHTML = fatia.length ?
      '<table><thead><tr><th>Empresa</th><th>Tributação</th><th>Faixa</th><th>Porte</th>'+
      '<th>Score</th><th>Prioridade</th><th>Honorário</th><th>Plano indicado</th><th>Gap</th>'+
      '</tr></thead><tbody>'+ fatia.map(function(e){
        return '<tr class="clicavel" onclick="location.hash=\'#/empresa/'+e.cnpj+'\'">'+
          '<td><div class="cel-emp"><span class="cel-nome">'+esc(e.empresa)+
            (e.saiu?' <span class="selo selo-neutro">saiu</span>':'')+'</span>'+
            '<span class="cel-cnpj">'+esc(e.cnpjFmt)+'</span></div></td>'+
          '<td style="font-size:12px;">'+esc(e.tributacao||'—')+'</td>'+
          '<td class="mono" style="font-size:12px;">'+esc(e.faixa||'—')+
            (num(e.rbt12) ? '<div style="margin-top:2px;"><button type="button" class="num-link" '+
              'onclick="event.stopPropagation();detalharRBT12(\''+esc(e.cnpj)+'\')" '+
              'title="Ver o mês a mês">'+fmtCurto(e.rbt12)+'</button></div>'+
              '<div class="cel-cnpj">média '+fmtCurto(num(e.rbt12)/12)+'/mês</div>' : '')+'</td>'+
          '<td style="font-size:12px;">'+esc(e.porte||'—')+'</td>'+
          '<td class="mono">'+fmtNum(e.score)+'</td>'+
          '<td>'+prioridadeSelo(e.prioridade)+'</td>'+
          celHonorario(e)+
          '<td style="font-size:12px;">'+esc(e.planoIndicado||'—')+
            (e.pisoPlano?'<div class="cel-cnpj">piso '+fmtCurto(e.pisoPlano)+'</div>':'')+'</td>'+
          '<td>'+(e.naoCobramos ? '<span class="selo selo-info">acordo</span>'
                 : e.okSemFaturamento ? '<span class="selo selo-ok">ok · sem faturar</span>'
                 : num(e.gapHonorario)>0 ? '<span class="selo selo-alerta">+'+fmtCurto(e.gapHonorario)+'</span>'
                 : e.honorarioAtual===null ? '<span class="selo selo-neutro">sem valor</span>'
                 : '<span class="selo selo-ok">ok</span>')+'</td></tr>';
      }).join('')+'</tbody></table>'
      : '<div class="vazio"><div class="vazio-ico">▦</div>Nenhuma empresa com esses filtros.</div>';

    document.getElementById('e-pag').innerHTML = l.length>porPagina ?
      '<button class="btn btn-p btn-fantasma" id="e-ant"'+(pagina===0?' disabled':'')+'>← Anterior</button>'+
      '<span>Página '+(pagina+1)+' de '+totalPag+' · '+fmtNum(l.length)+' empresas</span>'+
      '<button class="btn btn-p btn-fantasma" id="e-prox"'+(pagina>=totalPag-1?' disabled':'')+'>Próxima →</button>'
      : '<span>'+fmtNum(l.length)+' empresa(s)</span>';
    var a = document.getElementById('e-ant'), p = document.getElementById('e-prox');
    if(a) a.addEventListener('click', function(){ pagina--; aplicar(); });
    if(p) p.addEventListener('click', function(){ pagina++; aplicar(); });
  }

  document.getElementById('e-busca').addEventListener('input', function(){ pagina=0; aplicar(); });
  ['e-faixa','e-ramo','e-prio','e-grupo','e-gap','e-ativos'].forEach(function(id){
    document.getElementById(id).addEventListener('change', function(){ pagina=0; aplicar(); });
  });
  document.getElementById('e-nova').addEventListener('click', function(){ formEmpresa(null); });
  document.getElementById('e-exp').addEventListener('click', function(){
    exportar('empresas.xlsx','Empresas',
      ['CNPJ','Empresa','Código Domínio','Tributação','Situação','Tipo','Fiscal','Faixa','Porte',
       'Fat. no período','RBT12','Honorário atual','Grupo','Plano indicado','Piso','Gap plano','Gap régua',
       'Score','Prioridade','Contato','WhatsApp'],
      listaAtual.map(function(e){
        return [e.cnpjFmt,e.empresa,e.codigoDominio,e.tributacao,e.situacao,e.tipo,e.fiscal,
          e.faixa,e.porte,num(e.fatPeriodo),num(e.rbt12),num(e.honorarioAtual),e.grupoHonorario,e.planoIndicado,
          num(e.pisoPlano),num(e.gapPlano),num(e.gapHonorario),e.score,
          (S.listas.prioridadeLabel||{})[e.prioridade]||e.prioridade,e.contato,e.whatsapp];
      }), this);
  });

  aplicar();
}

/* ===========================================================================
   TELA — DETALHE DA EMPRESA
   =========================================================================== */
function telaEmpresaDetalhe(cnpj){
  var e = S.porCnpj[cnpj];
  if(!e){
    document.getElementById('conteudo').innerHTML =
      '<div class="vazio"><div class="vazio-ico">?</div>Empresa não encontrada.'+
      '<div style="margin-top:12px;"><a class="btn btn-fantasma" href="#/empresas">← Voltar</a></div></div>';
    return;
  }
  document.getElementById('titulo').textContent = e.empresa;
  document.getElementById('topo-meta').textContent = e.cnpjFmt+' · '+(e.situacao||'—');
  document.getElementById('topo-acoes').innerHTML =
    '<a class="btn btn-fantasma btn-p" href="#/precificacao/'+esc(e.cnpj)+'">Calcular preço</a>'+
    '<button class="btn btn-fantasma btn-p" id="d-rel">Relacionamento</button>'+
    '<button class="btn btn-fantasma btn-p" id="d-baixa">'+(e.saiu?'Reativar':'Dar baixa')+'</button>'+
    '<button class="btn btn-fantasma btn-p" id="d-edit">Editar</button>'+
    '<button class="btn btn-1 btn-p" id="d-trat">Registrar tratativa</button>';

  var gats = S.gatilhos.filter(function(g){ return g.cnpj===cnpj; });
  var trats = S.tratativas.filter(function(t){ return t.cnpj===cnpj; })
    .sort(function(a,b){ return (b.data||'').localeCompare(a.data||''); });

  document.getElementById('conteudo').innerHTML =
    (e.saiu ? '<div class="aviso aviso-atencao"><span class="aviso-ico">!</span><div>'+
      '<b>Cliente com baixa registrada</b> em '+fmtData(e.dataBaixa)+
      (e.motivoBaixa?' — '+esc(e.motivoBaixa):'')+'. O histórico foi preservado.</div></div>' : '')+

    // Primeira coisa da ficha: o que ele paga hoje contra o que o plano Exemplo
    // manda cobrar. É a pergunta que abre toda conversa de reajuste.
    (function(){
      var pago = num(e.honorarioAtual), piso = num(e.pisoPlano);
      var dif = piso - pago;
      if(!piso) return '';
      var ok = dif <= 0;
      return '<div class="sec"><div class="cartao" style="padding:0;overflow:hidden;">'+
        '<div style="display:flex;flex-wrap:wrap;align-items:stretch;'+
        'border-left:4px solid '+(ok?'var(--ok)':'var(--erro)')+';">'+
          '<div style="padding:16px 20px;flex:1;min-width:180px;">'+
            '<div class="ind-rot">Cobrado hoje</div>'+
            '<div class="ind-val" style="font-size:26px;">'+fmtBRL(pago)+'</div>'+
            '<div class="ind-sub">'+(e.grupoHonorario?'grupo '+esc(e.grupoHonorario):'sem grupo')+'</div>'+
          '</div>'+
          '<div style="padding:16px 20px;flex:1;min-width:180px;border-left:1px solid var(--border);">'+
            '<div class="ind-rot">Piso do plano '+esc(e.planoIndicado||'—')+'</div>'+
            '<div class="ind-val" style="font-size:26px;">'+fmtBRL(piso)+'</div>'+
            '<div class="ind-sub">'+esc(e.ramo||'')+' · '+esc(e.faixa||'')+'</div>'+
          '</div>'+
          '<div style="padding:16px 20px;flex:1.2;min-width:220px;border-left:1px solid var(--border);'+
          'background:'+(ok?'var(--ok-bg)':'var(--erro-bg)')+';">'+
            '<div class="ind-rot">'+(ok?'Situação':'Falta para o piso')+'</div>'+
            '<div class="ind-val" style="font-size:26px;color:'+(ok?'var(--ok)':'var(--erro)')+';">'+
              (ok ? 'No piso' : fmtBRL(dif))+'</div>'+
            '<div class="ind-sub">'+(ok
              ? 'Cobrança igual ou acima do piso comercial.'
              : fmtBRL(dif*12)+' por ano · '+(pago?((dif/pago)*100).toFixed(0):'—')+'% de reajuste')+
            '</div>'+
          '</div>'+
        '</div></div></div>'+
      '';
    })()+

    '<div class="sec"><div class="ind-grade">'+
      ind('Score', fmtNum(e.score), (S.listas.prioridadeLabel||{})[e.prioridade]||'Normal',
          e.prioridade==='ALTA_PRIORIDADE'?'alerta':e.prioridade==='ANALISAR'?'laranja':'neutro')+
      ind('Honorário atual', textoHonorario(e),
          e.naoCobramos ? 'acordo de não cobrança registrado'
            : e.okSemFaturamento ? 'sem faturar · acima de 10% do SM, ok'
            : e.grupoHonorario?'grupo '+esc(e.grupoHonorario):'sem grupo definido',
          e.naoCobramos?'neutro':'')+
      ind('Régua do SM', e.honorarioIdeal?fmtBRL(e.honorarioIdeal):'fora da régua',
          e.grupoIdeal?esc(e.grupoIdeal):'porte acima do limite', 'laranja')+
      '<div class="ind'+(num(e.rbt12)?' link':'')+'"'+(num(e.rbt12)
        ? ' role="button" tabindex="0" onclick="detalharRBT12(\''+esc(e.cnpj)+'\')"'+
          ' onkeydown="if(event.key===\'Enter\'){detalharRBT12(\''+esc(e.cnpj)+'\')}"' : '')+'>'+
        '<div class="ind-rot">RBT12</div><div class="ind-val">'+fmtCurto(e.rbt12)+'</div>'+
        '<div class="ind-sub">'+esc(e.faixa||'—')+' · '+esc(e.porte||'—')+
        (num(e.rbt12)?' · clique para o mês a mês':'')+'</div></div>'+
      ind('Média mensal', fmtCurto(num(e.rbt12)/12), 'RBT12 ÷ 12')+
      ind('Plano indicado', esc(e.planoIndicado||'—'),
          e.pisoPlano?'piso '+fmtBRL(e.pisoPlano)+' · '+esc(e.ramo||''):'')+
      ind('Sem reajuste há', e.mesesSemReajuste!==null?fmtNum(e.mesesSemReajuste)+' meses':'—',
          e.dataUltimoReajuste?'último em '+fmtData(e.dataUltimoReajuste):'nunca registrado')+
    '</div></div>'+

    // Grupo econômico. Antes olhava só a raiz do CNPJ — e a raiz só enxerga
    // matriz e filial. Agora usa o grupo nomeado no Tabelão quando existe, que
    // é o que junta empresas do mesmo dono com CNPJs sem parentesco.
    (function(){
      var chave = chaveGrupo(e);
      var irmas = S.empresas.filter(function(x){
        return chaveGrupo(x) === chave && x.cnpj !== e.cnpj; });
      if(!irmas.length) return '';
      var grupo = [e].concat(irmas);
      var total = grupo.reduce(function(a,x){ return a+num(x.honorarioAtual); },0);
      var matriz = grupo.filter(function(x){ return x.matrizFilial === 'Matriz'; })[0];
      var torto = matriz && !num(matriz.honorarioAtual) && total > 0;
      return '<div class="sec"><div class="sec-tit">Grupo econômico '+
        '<span class="leve">'+(e.grupoEmpresarial
          ? esc(e.grupoEmpresarial)+' (Tabelão)'
          : 'mesma raiz de CNPJ')+' · '+fmtNum(grupo.length)+' empresas · '+
        'honorário do grupo '+fmtBRL(total)+'</span>'+
        '<a href="#/grupos" style="float:right;font-weight:600;text-transform:none;letter-spacing:0;">'+
        'ver todos os grupos →</a></div>'+
        (torto ? '<div class="aviso aviso-atencao"><span class="aviso-ico">!</span><div>'+
          'A matriz está sem honorário e as filiais pagam. Vale conferir se a cobrança '+
          'deveria estar no CNPJ da matriz.</div></div>' : '')+
        '<div class="tab-caixa"><table><thead><tr><th>Empresa</th><th>Tipo</th>'+
        '<th>Faixa</th><th>RBT12</th><th>Honorário</th><th>Piso</th><th></th></tr></thead><tbody>'+
        grupo.map(function(x){
          var aqui = x.cnpj === e.cnpj;
          return '<tr'+(aqui?' style="background:var(--verde-claro);"':'')+'>'+
            '<td><div class="cel-emp"><span class="cel-nome">'+esc(x.empresa)+
            (aqui?' <span class="selo selo-ok">esta</span>':'')+'</span>'+
            '<span class="cel-cnpj">'+esc(x.cnpjFmt)+'</span></div></td>'+
            '<td style="font-size:12px;">'+esc(x.matrizFilial||'—')+'</td>'+
            '<td style="font-size:12px;">'+esc(x.faixa||'—')+'</td>'+
            '<td class="mono">'+fmtCurto(x.rbt12)+'</td>'+
            '<td class="mono">'+(num(x.honorarioAtual)?fmtBRL(x.honorarioAtual):
              '<span class="selo selo-atencao">sem valor</span>')+'</td>'+
            '<td class="mono">'+fmtBRL(x.pisoPlano)+'</td>'+
            '<td>'+(aqui?'':'<button class="btn btn-p btn-fantasma" onclick="location.hash=\'#/empresa/'+
              x.cnpj+'\'">Abrir →</button>')+'</td></tr>';
        }).join('')+
        '<tr style="border-top:2px solid var(--border-forte);"><td colspan="4" '+
        'style="font-weight:700;">Total do grupo</td>'+
        '<td class="mono" style="font-weight:700;">'+fmtBRL(total)+'</td><td colspan="2"></td></tr>'+
        '</tbody></table></div></div>';
    })()+

    '<div class="sec grade-2">'+
      '<div><div class="sec-tit">Cadastro</div>'+
        '<div class="cartao"><div class="kv">'+
          kv('Código Domínio', e.codigoDominio)+ kv('Tributação', e.tributacao)+
          kv('Tipo', e.tipo)+ kv('Fiscal responsável', e.fiscal)+
          kv('Folha responsável', e.folhaResp)+ kv('Funcionários', e.qtdFuncionarios)+
          kv('Contato', e.contato)+ kv('WhatsApp', e.whatsapp)+
          kv('Cidade', e.cidade)+ kv('Qualidade dos dados', e.qualidade)+
        '</div></div>'+
        '<div class="sec-tit" style="margin-top:20px;">Relacionamento</div>'+
        '<div class="cartao"><div class="kv">'+
          kv('Situação no atendimento', e.situacaoAtendimento||'sem registro')+
          kv('Canal preferido', e.canalPreferido)+
          kv('Responsável', e.respAtendimento)+
          kv('Urgência de cobrança', e.urgenciaCobranca || (urgenciaSugerida(e)?urgenciaSugerida(e)+' (sugerida)':'—'))+
          kv('É indicador', e.eIndicador?'Sim':'Não')+
          kv('Títulos vencidos', e.titulosVencidos?fmtNum(e.titulosVencidos)+' · '+fmtBRL(e.valorVencido):'nenhum')+
        '</div>'+
        (e.obsFinanceiro || e.obsAtendimento
          ? '<div style="padding:13px 15px;border-top:1px solid var(--border);">'+
            (e.obsFinanceiro ? '<div class="kv-rot">Relacionamento financeiro</div>'+
              '<div style="font-size:12.5px;line-height:1.55;">'+esc(e.obsFinanceiro)+'</div>' : '')+
            (e.obsAtendimento ? '<div class="kv-rot" style="margin-top:'+(e.obsFinanceiro?'11px':'0')+';">'+
              'Observação do atendimento</div><div style="font-size:12.5px;line-height:1.55;">'+
              esc(e.obsAtendimento)+'</div>' : '')+
            '</div>'
          : '<div style="padding:11px 15px;border-top:1px solid var(--border);" class="dica">'+
            'Sem observação de relacionamento financeiro. Use <b>Editar</b> para registrar como é a '+
            'relação de pagamento com este cliente.</div>')+
        '</div>'+
      '</div>'+
      '<div><div class="sec-tit">Gatilhos ('+gats.length+')</div>'+
        (gats.length ? '<div class="cartao" style="padding:14px 16px;"><div class="pilha">'+
          gats.map(function(g){
            return '<div style="border-bottom:1px solid var(--border);padding-bottom:9px;">'+
              '<div class="acoes" style="justify-content:space-between;">'+gatilhoSelo(g.tipo)+
              '<span class="selo selo-neutro">'+esc(g.competencia)+'</span></div>'+
              '<div style="font-size:12.5px;color:var(--texto-suave);margin-top:5px;">'+esc(g.descricao)+'</div>'+
              '<div class="lt-meta">'+esc(g.status)+(g.responsavel?' · '+esc(g.responsavel):'')+
              (g.justificativa?' · <b>'+esc(g.justificativa)+'</b>':'')+'</div></div>';
          }).join('')+'</div></div>'
        : '<div class="cartao"><div class="vazio">Nenhum gatilho ativo.</div></div>')+

        '<div class="sec-tit" style="margin-top:20px;">Tratativas ('+trats.length+')</div>'+
        (trats.length ? '<div class="cartao" style="padding:16px;"><div class="linha-tempo">'+
          trats.map(function(t){
            return '<div class="lt-item"><div class="lt-ponto"></div><div>'+
              '<div class="lt-tit">'+esc(t.status)+
              (t.honorarioNovo?' — '+fmtBRL(t.honorarioAnterior)+' → '+fmtBRL(t.honorarioNovo):'')+'</div>'+
              '<div class="lt-meta">'+fmtDataHora(t.data)+' · '+esc(t.responsavel||'—')+'</div>'+
              (t.justificativa?'<div class="lt-obs"><b>Justificativa:</b> '+esc(t.justificativa)+'</div>':'')+
              (t.observacao?'<div class="lt-obs">'+esc(t.observacao)+'</div>':'')+
              '</div></div>';
          }).join('')+'</div></div>'
        : '<div class="cartao"><div class="vazio">Nenhuma tratativa registrada.</div></div>')+
      '</div>'+
    '</div>'+

    '<div class="sec"><div class="sec-tit">Histórico mensal</div>'+
      '<div class="cartao" id="d-serie"><div class="carregando"><div class="giro"></div>'+
      'Carregando a série da empresa…</div></div></div>';

  chamar('api_carregarEmpresa', [cnpj], function(res){
    var cx = document.getElementById('d-serie');
    if(!cx) return;
    var serie = (res.serie||[]).filter(function(p){ return p.faturamento!==null; });
    if(!serie.length){
      cx.innerHTML = '<div class="vazio"><div class="vazio-ico">▤</div>'+
        'Sem faturamento importado para esta empresa.</div>';
      return;
    }
    var p = periodoAtual();
    var vis = serie.filter(function(x){ return x.competencia>=p.de && x.competencia<=p.ate; });
    if(vis.length<2) vis = serie.slice(-24);
    var max = Math.max.apply(null, vis.map(function(x){ return x.faturamento; }));
    cx.innerHTML = '<div style="padding:16px;">'+
      '<div class="dica" style="margin-bottom:10px;">'+vis.length+' competência(s) · '+
      periodoIntervalo()+'</div>'+
      vis.slice(-24).map(function(x){
        return '<div class="barra-lin"><span class="barra-rot mono">'+esc(x.competenciaDisplay)+'</span>'+
          '<div class="barra-trilho"><div class="barra-preenche" style="width:'+
          (max?(x.faturamento/max*100).toFixed(1):0)+'%"></div></div>'+
          '<span class="barra-val">'+fmtCurto(x.faturamento)+'</span>'+
          '<span class="barra-num">'+(x.funcionarios!==null?x.funcionarios+' f':'')+'</span></div>';
      }).join('')+'</div>';
  });

  document.getElementById('d-trat').addEventListener('click', function(){ formTratativa(e, null); });
  document.getElementById('d-edit').addEventListener('click', function(){ formEmpresa(e); });
  document.getElementById('d-rel').addEventListener('click', function(){ formRelacionamento(e); });
  document.getElementById('d-baixa').addEventListener('click', function(){ formBaixa(e); });
}

function kv(rot, val){
  return '<div><div class="kv-rot">'+esc(rot)+'</div>'+
         '<div class="kv-val">'+esc(val===null||val===undefined||val===''?'—':val)+'</div></div>';
}

/* ===========================================================================
   FORMULÁRIOS
   =========================================================================== */
function formTratativa(e, gatilho){
  abrirModal('Registrar tratativa — '+e.empresa,
    '<div class="form-grade">'+
      '<div class="campo"><label for="t-status">Status</label><select id="t-status">'+
        (S.listas.statusTratativa||[]).map(function(s){
          return '<option'+(s==='Em análise'?' selected':'')+'>'+esc(s)+'</option>'; }).join('')+
      '</select></div>'+

function telaHonorarios(){
  var emp = ativos().filter(function(e){ return num(e.honorarioAtual)>0; });
  var vals = emp.map(function(e){ return num(e.honorarioAtual); }).sort(function(a,b){ return a-b; });
  var soma = vals.reduce(function(a,v){ return a+v; },0);
  function q(p){
    if(!vals.length) return 0;
    var i = (vals.length-1)*p, lo = Math.floor(i), hi = Math.ceil(i);
    return lo===hi ? vals[lo] : vals[lo]+(vals[hi]-vals[lo])*(i-lo);
  }
  var defasadas = ativos().filter(function(e){ return num(e.gapHonorario)>0; });
  var potencial = defasadas.reduce(function(a,e){ return a+num(e.gapHonorario); },0);

  var porGrupo = {};
  emp.forEach(function(e){
    var g = e.grupoHonorario || 'Sem grupo';
    if(!porGrupo[g]) porGrupo[g] = {n:0, soma:0};
    porGrupo[g].n++; porGrupo[g].soma += num(e.honorarioAtual);
  });
  var grupos = Object.keys(porGrupo).map(function(g){
    return {grupo:g, n:porGrupo[g].n, mediana:porGrupo[g].soma/porGrupo[g].n};
  }).sort(function(a,b){ return b.n-a.n; }).slice(0,12);
  var maxG = Math.max.apply(null, grupos.map(function(g){ return g.n; })) || 1;

  document.getElementById('topo-meta').textContent =
    'SM '+fmtBRL(S.meta.salarioMinimo)+' · régua '+fmtBRL(S.meta.reguaSemNota)+
    ' sem NF / '+fmtBRL(S.meta.reguaComNota)+' com NF';
  document.getElementById('topo-acoes').innerHTML =
    '<button class="btn btn-fantasma btn-p" id="h-exp">Exportar simulação</button>';

  document.getElementById('conteudo').innerHTML =
    '<div class="aviso aviso-info"><span class="aviso-ico">i</span><div>'+
    '<b>Régua aprovada:</b> o grupo do cliente é um percentual do salário mínimo. '+
    'Sem emissão de notas → <b>'+fmtBRL(S.meta.reguaSemNota)+'</b>. Com emissão e BPO integrado → '+
    '<b>'+fmtBRL(S.meta.reguaComNota)+'</b>. Acima da '+num(S.config.faixa_limite_regua_fixa)+
    'ª faixa do Simples a régua fixa não se aplica.</div></div>'+

    // Todo quadro abre a lista que o gerou: nenhum número aqui é indevassável.
    '<div class="sec"><div class="ind-grade">'+
      indLista('Faturaram no período', fmtNum(emp.filter(function(e){
          return num(e.fatPeriodo)>0; }).length), periodoIntervalo(), '',
        'Faturaram no período', emp.filter(function(e){ return num(e.fatPeriodo)>0; }),
        {subtitulo:'A faixa e o piso do plano acompanham o RBT12 que fecha nessa janela.'})+
      indLista('Receita contratada', fmtCurto(soma), fmtNum(emp.length)+' clientes com valor', '',
        'Clientes com honorário contratado', emp)+
      indLista('Mediana', fmtCurto(q(.5)),
        S.meta.salarioMinimo?((q(.5)/S.meta.salarioMinimo*100).toFixed(0)+'% do SM'):'', '',
        'Clientes que pagam acima da mediana ('+fmtBRL(q(.5))+')',
        emp.filter(function(e){ return num(e.honorarioAtual) >= q(.5); }),
        {subtitulo:'Metade da carteira paga até '+fmtBRL(q(.5))+'. Esta é a metade de cima.'})+
      indLista('Quartil inferior', fmtCurto(q(.25)), '1 em cada 4 paga até isso', '',
        'Clientes no quartil inferior (até '+fmtBRL(q(.25))+')',
        emp.filter(function(e){ return num(e.honorarioAtual) <= q(.25); }),
        {subtitulo:'Os 25% que menos pagam — onde a defasagem costuma se concentrar.'})+
      indLista('Quartil superior', fmtCurto(q(.75)), 'os 25% que mais pagam', '',
        'Clientes no quartil superior (a partir de '+fmtBRL(q(.75))+')',
        emp.filter(function(e){ return num(e.honorarioAtual) >= q(.75); }))+
      indLista('Abaixo da régua', fmtNum(defasadas.length),
        'de '+fmtNum(ativos().length)+' ativos', 'alerta',
        'Abaixo da régua do salário mínimo', defasadas,
        {subtitulo:'Honorário menor que o valor do grupo indicado pela régua do SM.'})+
      indLista('Potencial mensal', fmtCurto(potencial), fmtCurto(potencial*12)+'/ano', 'laranja',
        'Potencial de reajuste pela régua', defasadas,
        {subtitulo:'Soma das diferenças: '+fmtBRL(potencial)+'/mês, '+fmtBRL(potencial*12)+'/ano.'})+
    '</div></div>'+

    '<div class="sec grade-2">'+
      '<div><div class="sec-tit">Distribuição por grupo <span class="leve">grupo = % do salário mínimo</span></div>'+
        '<div class="cartao" style="padding:16px 18px;">'+ grupos.map(function(g){
          var doGrupo = emp.filter(function(e){ return (e.grupoHonorario||'Sem grupo')===g.grupo; });
          return '<div class="barra-lin"><span class="barra-rot">'+esc(g.grupo)+'</span>'+
            '<div class="barra-trilho"><div class="barra-preenche" style="width:'+
            (g.n/maxG*100).toFixed(1)+'%"></div></div>'+
            '<span class="barra-val">'+fmtCurto(g.mediana)+'</span>'+
            '<span class="barra-num">'+numClicavel(g.n, 'Grupo '+g.grupo, doGrupo,
              {subtitulo:'Média do grupo: '+fmtBRL(g.mediana)+'.'})+'</span></div>';
        }).join('') +'</div></div>'+
      '<div><div class="sec-tit">Régua do salário mínimo</div>'+
        '<div class="cartao" style="padding:6px 16px 14px;"><table><tbody>'+
        [0.10,0.15,0.20,0.25,0.30,0.40,0.50,1.00].map(function(p){
          var alvo = (p===num(S.config.pct_reajuste_sem_nota) || p===num(S.config.pct_reajuste_com_nota));
          return '<tr><td style="font-weight:700;">G'+Math.round(p*100)+'</td>'+
            '<td class="mono suave">'+(p*100).toFixed(0)+'% do SM</td>'+
            '<td class="mono" style="text-align:right;'+(alvo?'color:var(--verde);font-weight:700;':'')+'">'+
            fmtBRL(Math.round(num(S.meta.salarioMinimo)*p))+'</td>'+
            '<td class="fraco" style="font-size:11px;">'+
            (p===num(S.config.pct_reajuste_sem_nota)?'alvo sem NF':
             p===num(S.config.pct_reajuste_com_nota)?'alvo com NF':'')+'</td></tr>';
        }).join('')+'</tbody></table></div></div>'+
    '</div>'+

    // Faixas de valor praticadas: mostra em que degrau de preço a carteira
    // realmente está, e o quanto disso fica abaixo do piso do plano.
    // Dois grupos que não cabem na régua e precisam de decisão, não de
    // reajuste: quem não tem honorário cadastrado e quem não fatura.
    (function(){
      var todos = ativos();
      var semHon = todos.filter(function(e){ return !num(e.honorarioAtual); });
      // Sem faturamento DENTRO da janela: com 1 mês selecionado a lista é
      // maior que com 3 anos, e é isso que se quer ver.
      var semFat = todos.filter(function(e){ return !num(e.fatPeriodo); });
      var ambos  = todos.filter(function(e){ return !num(e.honorarioAtual) && !num(e.fatPeriodo); });
      var semFatComHon = todos.filter(function(e){
        return !num(e.fatPeriodo) && num(e.honorarioAtual) > 0; });
      var receitaParada = semFatComHon.reduce(function(a,e){ return a+num(e.honorarioAtual); },0);
      var comPendencia = semFat.filter(function(e){ return e.pendenciaFiscal; });
      if(!semHon.length && !semFat.length) return '';
      return '<div class="sec"><div class="sec-tit">Fora da régua — precisam de decisão, '+
        'não de reajuste</div>'+
        '<div class="ind-grade">'+
          indLista('Sem honorário cadastrado', fmtNum(semHon.length),
            'não entram em nenhuma conta', 'alerta',
            'Sem honorário cadastrado', semHon,
            {subtitulo:'Sem valor no cadastro o cliente some da receita, da defasagem e do '+
             'plano. É cadastro a corrigir, não cliente a reajustar.'})+

/* ===========================================================================

function telaRelacionamento(){
  var emp = ativos();
  var porSit = {};
  (S.listas.sitAtendimento||[]).forEach(function(s){ porSit[s]=0; });
  emp.forEach(function(e){
    var s = e.situacaoAtendimento || 'Sem registro';
    porSit[s] = (porSit[s]||0)+1;
  });
  var maxS = Math.max.apply(null, Object.keys(porSit).map(function(k){ return porSit[k]; })) || 1;
  var indicadores = emp.filter(function(e){ return e.eIndicador; });
  var comWhats = emp.filter(function(e){ return e.whatsapp; }).length;
  var urgAlta = emp.filter(function(e){
    return (e.urgenciaCobranca||urgenciaSugerida(e))==='Alta'; }).length;

  document.getElementById('topo-meta').textContent =
    fmtNum(comWhats)+' com WhatsApp · '+fmtNum(emp.length-(porSit['Sem registro']||0))+' com situação registrada';

  document.getElementById('conteudo').innerHTML =
    '<div class="aviso aviso-info"><span class="aviso-ico">i</span><div>'+
    'A situação no atendimento e a marcação de indicador são preenchidas aqui pelo time e '+
    'ficam salvas no cadastro. Contato e WhatsApp vêm do Tabelão.</div></div>'+

    '<div class="sec"><div class="ind-grade">'+
      indLista('Clientes indicadores', fmtNum(indicadores.length),
        'trazem outros clientes', '', 'Clientes que indicam', indicadores)+
      indLista('Com WhatsApp', fmtNum(comWhats),
        (emp.length?(comWhats/emp.length*100).toFixed(0):0)+'% da carteira', '',
        'Clientes com WhatsApp', emp.filter(function(e){ return e.whatsapp; }))+
      indLista('Sem situação registrada', fmtNum(porSit['Sem registro']||0),
        'aguardando o atendimento', 'laranja', 'Sem registro de atendimento',
        emp.filter(function(e){ return !e.situacaoAtendimento; }),
        {subtitulo:'O time ainda não classificou a relação com estes clientes.'})+
      indLista('Cobrança urgente', fmtNum(urgAlta),
        'alta urgência (registrada ou sugerida)', 'alerta', 'Cobrança de alta urgência',
        emp.filter(function(e){ return (e.urgenciaCobranca||urgenciaSugerida(e))==='Alta'; }))+
    '</div></div>'+

    '<div class="sec grade-2">'+
      '<div><div class="sec-tit">Situação no atendimento</div>'+
        '<div class="cartao" style="padding:16px 18px;">'+
        (S.listas.sitAtendimento||[]).map(function(s){
          return '<div class="barra-lin"><span class="barra-rot">'+esc(s)+'</span>'+
            '<div class="barra-trilho"><div class="barra-preenche" style="width:'+
            ((porSit[s]||0)/maxS*100).toFixed(1)+'%'+
            (s==='Risco de saída'||s==='Relação desgastada'?';background:var(--alerta)':
             s==='Sem registro'?';background:var(--border-forte)':'')+'"></div></div>'+
            '<span class="barra-num">'+numClicavel(porSit[s]||0, 'Atendimento — '+s,
              emp.filter(function(e){ return (e.situacaoAtendimento||'Sem registro')===s; }))+
            '</span></div>';
        }).join('')+'</div></div>'+
      '<div><div class="sec-tit">Clientes que indicam</div>'+
        '<div class="cartao">'+ (indicadores.length ?
          '<table><thead><tr><th>Cliente</th><th>Situação</th><th>Honorário</th></tr></thead><tbody>'+
          indicadores.slice(0,20).map(function(e){
            return '<tr class="clicavel" onclick="location.hash=\'#/empresa/'+e.cnpj+'\'">'+
              '<td class="cel-nome" style="font-size:12.5px;">'+esc(e.empresa)+'</td>'+
              '<td style="font-size:11.5px;">'+esc(e.situacaoAtendimento||'sem registro')+'</td>'+
              '<td class="mono">'+fmtBRL(e.honorarioAtual)+'</td></tr>';

          : '<div class="vazio"><div class="vazio-ico">☎</div>Nenhum cliente marcado como indicador.'+

        '</div></div>'+

    '<div class="sec"><div class="sec-tit">Sem registro de atendimento</div>'+
      '<div class="tab-caixa"><table><thead><tr><th>Empresa</th><th>Contato</th><th>WhatsApp</th>'+
      '<th>Fiscal</th><th>Urgência sugerida</th><th></th></tr></thead><tbody>'+
      emp.filter(function(e){ return !e.situacaoAtendimento; }).slice(0,50).map(function(e){
        var s = urgenciaSugerida(e);
        return '<tr><td><div class="cel-emp"><span class="cel-nome">'+esc(e.empresa)+'</span>'+
          '<span class="cel-cnpj">'+esc(e.cnpjFmt)+'</span></div></td>'+

      '<div class="dica" style="margin-top:8px;">Mostrando até 50. Abra a empresa para registrar.</div>'+
    '</div>';
}

function telaSaidas(){
  var saidos = S.empresas.filter(function(e){ return e.saiu; });

  saidos.forEach(function(e){
    var m = e.motivoBaixa || 'Não informado';
    porMotivo[m] = (porMotivo[m]||0)+1;
  });
  var maxM = Math.max.apply(null, Object.keys(porMotivo).map(function(k){ return porMotivo[k]; })) || 1;
  var honPerdido = saidos.reduce(function(a,e){ return a+num(e.honorarioAtual); },0);

  document.getElementById('topo-meta').textContent = fmtNum(saidos.length)+' clientes fora da carteira';
  document.getElementById('conteudo').innerHTML =
    '<div class="aviso aviso-info"><span class="aviso-ico">↩</span><div>'+
    'Histórico preservado de quem saiu. Se o cliente voltar, a ficha mostra como era o '+
    'relacionamento, o fiscal e o financeiro dele — a decisão de reabrir deixa de depender de memória.</div></div>'+

    '<div class="sec"><div class="ind-grade">'+
      indLista('Fora da carteira', fmtNum(saidos.length),
        'com histórico guardado', 'neutro', 'Clientes que saíram', saidos)+
      indLista('Honorário que saiu', fmtCurto(honPerdido),
        'por mês, na data da baixa', 'alerta', 'Honorário perdido',
        saidos.filter(function(e){ return num(e.honorarioAtual)>0; }),
        {subtitulo:'Somam '+fmtBRL(honPerdido)+'/mês que deixaram de entrar.'})+
      indLista('Saíram devendo', fmtNum(saidos.filter(function(e){ return e.titulosVencidos>0; }).length),
        'com título vencido em aberto', 'alerta', 'Saíram com dívida em aberto',
        saidos.filter(function(e){ return e.titulosVencidos>0; }))+
      indLista('Eram indicadores', fmtNum(saidos.filter(function(e){ return e.eIndicador; }).length),
        'traziam outros clientes', '', 'Indicadores que saíram',
        saidos.filter(function(e){ return e.eIndicador; }),
        {subtitulo:'A saída deles derruba também a indicação de novos clientes.'})+
    '</div></div>'+

    (saidos.length ?
      '<div class="sec grade-2"><div><div class="sec-tit">Por que saíram</div>'+
        '<div class="cartao" style="padding:16px 18px;">'+
        Object.keys(porMotivo).sort(function(a,b){ return porMotivo[b]-porMotivo[a]; }).map(function(m){
          return '<div class="barra-lin"><span class="barra-rot" title="'+esc(m)+'">'+esc(m)+'</span>'+
            '<div class="barra-trilho"><div class="barra-preenche" style="width:'+
            (porMotivo[m]/maxM*100).toFixed(1)+'%"></div></div>'+
            '<span class="barra-num">'+porMotivo[m]+'</span></div>';
        }).join('')+'</div></div><div></div></div>'+

      '<div class="sec"><div class="tab-caixa"><table><thead><tr><th>Empresa</th><th>Saída</th>'+
      '<th>Motivo</th><th>Honorário</th><th>Devia</th><th>Atendimento</th><th></th></tr></thead><tbody>'+
      saidos.map(function(e){
        return '<tr><td><div class="cel-emp"><span class="cel-nome">'+esc(e.empresa)+'</span>'+
          '<span class="cel-cnpj">'+esc(e.cnpjFmt)+'</span></div></td>'+
          '<td class="mono" style="font-size:12px;">'+fmtData(e.dataBaixa)+'</td>'+

    var m = {};
    document.querySelectorAll('[id^="r-"]').forEach(function(el){

      if(el.dataset.bool) m[chave] = el.checked;
      else if(el.dataset.texto) m[chave] = el.value;   // data da conferência de preço
      else if(el.dataset.pct==='1') m[chave] = Number(el.value)/100;
      else m[chave] = Number(el.value);
    });
    return m;
  }
  document.getElementById('r-salvar').addEventListener('click', function(){

      ocupado(b,false); S.config = res.config; avisar(res.mensagem,'ok');

      chamar('api_recalcular', [], function(res){
        ocupado(b,false); avisar(res.resultado.mensagem,'ok'); carregar();
      }, function(){ ocupado(b,false); });
    }, function(){ ocupado(b,false); });
  });
}
