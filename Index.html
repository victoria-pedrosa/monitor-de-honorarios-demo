/* Os movimentos não são empresas da base (muitos já saíram, outros nem chegaram
   a ser importados), então não dá para reaproveitar abrirLista — daí uma janela
   própria, com as mesmas teclas: busca, contagem e exportação. */
function colunasMovimento(){
  return [
    ['Empresa',  function(m){ return m.empresa; }],
    ['CNPJ',     function(m){ return m.cnpjFmt || m.cnpj || '—'; }],
    ['Data',     function(m){ return fmtData(m.data); }],
    ['Situação', function(m){ return m.situacao || '—'; }],
    ['Contrato', function(m){ return Math.abs(num(m.valorContrato)); }, true],
    ['Cobrado',  function(m){ return valorMov(m); }, true],
    ['Obs',      function(m){ return m.observacao || ''; }]
  ];
}
function colunasHonorario(){
  return [
    ['Empresa',   function(h){ return h.empresa; }],
    ['CNPJ',      function(h){ return h.cnpjFmt || h.cnpj || '—'; }],
    ['Tipo',      function(h){ return h.tipo || '—'; }],
    ['Anterior',  function(h){ return num(h.anterior); }, true],
    ['Novo',      function(h){ return num(h.novo); }, true],
    ['Diferença', function(h){ return num(h.diferenca); }, true]
  ];
}

var MOVDRILL = {};
var MOVSEQ = 0;
function numMov(texto, titulo, lista, cols){
  var chave = 'm'+(++MOVSEQ);
  MOVDRILL[chave] = {titulo:titulo, lista:lista, cols:cols};
  return '<button type="button" class="num-link" onclick="abrirMov(\'' + chave + '\')" '+
    'title="Ver os '+fmtNum(lista.length)+' registros">'+esc(String(texto))+'</button>';
}
function indMov(rot, val, sub, classe, titulo, lista, cols){
  var chave = 'm'+(++MOVSEQ);
  MOVDRILL[chave] = {titulo:titulo, lista:lista, cols:cols};
  return '<div class="ind '+(classe||'')+' link" role="button" tabindex="0" '+
    'onclick="abrirMov(\'' + chave + '\')" '+
    'onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();abrirMov(\''+chave+'\')}">'+
    '<div class="ind-rot">'+esc(rot)+'</div><div class="ind-val">'+val+'</div>'+
    (sub?'<div class="ind-sub">'+sub+'</div>':'')+'</div>';
}
function abrirMov(chave){
  var d = MOVDRILL[chave];
  if(!d) return;
  var cols = d.cols, lista = d.lista, filtrada = lista.slice();
  abrirModal(d.titulo,
    '<div class="filtros" style="margin-bottom:10px;">'+
      '<input type="search" id="mv-busca" placeholder="Buscar empresa ou CNPJ…" style="min-width:220px;">'+
      '<span class="espaco"></span><span class="dica" id="mv-cont" style="margin:0;"></span></div>'+
    '<div class="tab-caixa" style="max-height:52vh;overflow:auto;"><table><thead><tr>'+
      cols.map(function(c){ return '<th'+(c[2]?' class="num"':'')+'>'+esc(c[0])+'</th>'; }).join('')+
      '<th></th></tr></thead><tbody id="mv-corpo"></tbody></table></div>',
    [{rot:'Exportar Excel', primario:true, aoClicar:function(b){
      exportar(d.titulo.replace(/[^\w]+/g,'_').slice(0,40), d.titulo.slice(0,28),
        cols.map(function(c){ return c[0]; }),
        filtrada.map(function(x){ return cols.map(function(c){ return c[1](x); }); }), b);
    }}], true);

  function pintar(){
    var t = (document.getElementById('mv-busca').value||'').trim().toLowerCase();
    var dig = t.replace(/\D/g,'');
    filtrada = lista.filter(function(x){
      if(!t) return true;
      if(String(x.empresa||'').toLowerCase().indexOf(t) >= 0) return true;
      return dig ? String(x.cnpj||'').indexOf(dig) >= 0 : false;
    });
    document.getElementById('mv-corpo').innerHTML = filtrada.slice(0,300).map(function(x){
      // Só quem existe na base tem ficha; os demais são histórico puro.
      var naBase = S.porCnpj[x.cnpj];
      return '<tr>'+cols.map(function(c){
        var v = c[1](x);
        return c[2] ? '<td class="mono">'+fmtBRL(v)+'</td>'
                    : '<td style="font-size:12px;">'+esc(v)+'</td>';
      }).join('')+
      '<td>'+(naBase
        ? '<button class="btn btn-p btn-fantasma" onclick="fecharModal();location.hash=\'#/empresa/'+
          esc(x.cnpj)+'\'">Ficha →</button>'
        : '<span class="dica">fora da base</span>')+'</td></tr>';
    }).join('') || '<tr><td colspan="'+(cols.length+1)+'"><div class="vazio">Nada encontrado.</div></td></tr>';
    document.getElementById('mv-cont').textContent =
      'Mostrando '+Math.min(filtrada.length,300)+' de '+fmtNum(filtrada.length);
  }
  document.getElementById('mv-busca').addEventListener('input', pintar);
  pintar();
}

/* ===========================================================================
   TELA — ANÁLISE DE CARTEIRA
   Onde está o dinheiro e onde está a defasagem: distribuição por faixa do
   Simples, por grupo da régua, por plano e por responsável.
   =========================================================================== */
function telaCarteira(){
  var emp = ativos();
  var contratado = emp.reduce(function(a,e){ return a+num(e.honorarioAtual); },0);
  var ideal = emp.reduce(function(a,e){ return a+(num(e.pisoPlano)||num(e.honorarioIdeal)||num(e.honorarioAtual)); },0);
  var abaixo = emp.filter(function(e){ return num(e.pisoPlano) > num(e.honorarioAtual); });
  var gap = abaixo.reduce(function(a,e){ return a+(num(e.pisoPlano)-num(e.honorarioAtual)); },0);
  var ticket = emp.length ? contratado/emp.length : 0;

  /**
   * Bloco de distribuição. `medida` escolhe o que a barra mede:
   * 'honorario' (padrão) ou 'rbt12' (faturamento). A quantidade à direita é
   * sempre clicável e abre a lista daquele corte, com exportação.
   */
  function distribuir(chave, rotulo, medida, nota, ordem){
    medida = medida || 'honorario';
    var mapa = {};
    emp.forEach(function(e){
      var k = (typeof chave === 'function' ? chave(e) : e[chave]) || 'Sem classificação';
      if(!mapa[k]) mapa[k] = {qtd:0, honorario:0, rbt12:0, lista:[]};
      mapa[k].qtd++;
      mapa[k].honorario += num(e.honorarioAtual);
      mapa[k].rbt12 += num(e.rbt12);
      mapa[k].lista.push(e);
    });
    /* Por padrao ordena pelo tamanho da barra. Faixa do Simples nao: ali a
       ordem natural e 1a, 2a, 3a... porque a pergunta e como a carteira se
       distribui ao longo da escala, e ordenar por valor embaralhava a escala. */
    var chaves = Object.keys(mapa).sort(ordem === 'faixa'
      ? function(a,b){ return ordemFaixa(a) - ordemFaixa(b); }
      : function(a,b){ return mapa[b][medida] - mapa[a][medida]; });
    var max = Math.max.apply(null, chaves.map(function(k){ return mapa[k][medida]; })) || 1;
    var totalQtd = emp.length || 1;
    return '<div><div class="sec-tit">'+rotulo+'</div><div class="cartao" style="padding:16px 18px;">'+
      chaves.slice(0,10).map(function(k){
        var pct = (mapa[k].qtd/totalQtd*100).toFixed(1);
        return '<div class="barra-lin"><span class="barra-rot">'+esc(k)+'</span>'+
          '<div class="barra-trilho"><div class="barra-preenche" style="width:'+
          (mapa[k][medida]/max*100).toFixed(1)+'%"></div></div>'+
          '<span class="barra-val">'+fmtCurto(mapa[k][medida])+'</span>'+
          '<span class="barra-num" title="'+pct+'% da carteira">'+
          numClicavel(mapa[k].qtd, rotulo+' — '+k, mapa[k].lista,
            {subtitulo: pct+'% da carteira · honorário '+fmtBRL(mapa[k].honorario)+
                        ' · RBT12 '+fmtBRL(mapa[k].rbt12)})+'</span></div>';
      }).join('')+'</div>'+
      (nota ? '<div class="dica" style="margin-top:8px;">'+nota+'</div>' : '')+'</div>';
  }

  document.getElementById('topo-meta').textContent =
    fmtNum(emp.length)+' clientes ativos · ticket médio '+fmtBRL(ticket);

  document.getElementById('conteudo').innerHTML =
    '<div class="sec"><div class="ind-grade">'+
      indLista('Faturamento no período', fmtCurto(emp.reduce(function(a,e){
          return a+num(e.fatPeriodo); },0)), periodoIntervalo(), '',
        'Faturaram no período', emp.filter(function(e){ return num(e.fatPeriodo)>0; }),
        {subtitulo:'Soma do que a carteira declarou dentro da janela escolhida. '+
         'Muda quando você troca o período.'})+
      indLista('Honorário contratado', fmtCurto(contratado), fmtNum(emp.length)+' clientes ativos', '',
        'Clientes ativos', emp)+
      indLista('Ticket médio', fmtBRL(ticket), 'por cliente ativo', '',
        'Clientes acima do ticket médio', emp.filter(function(e){ return num(e.honorarioAtual) > ticket; }),
        {subtitulo:'Ticket médio da carteira: '+fmtBRL(ticket)+'.'})+
      indLista('Potencial no piso', fmtCurto(ideal), 'se todos estivessem no piso do plano', '',
        'Carteira no piso do plano', emp.slice().sort(function(a,b){
          return (num(b.pisoPlano)||num(b.honorarioAtual)) - (num(a.pisoPlano)||num(a.honorarioAtual)); }),
        {subtitulo:'Somaria '+fmtBRL(ideal)+'/mês contra os '+fmtBRL(contratado)+' contratados hoje.'})+
      indLista('Defasagem', fmtCurto(gap), fmtNum(abaixo.length)+' abaixo do piso', 'alerta',
        'Abaixo do piso do plano', abaixo,
        {subtitulo:'Somam '+fmtBRL(gap)+'/mês de diferença até o piso.'})+
      indLista('Ganho anual possível', fmtCurto(gap*12), 'ao corrigir toda a defasagem', 'laranja',
        'Abaixo do piso do plano', abaixo,
        {subtitulo:fmtBRL(gap*12)+' por ano se toda a defasagem for corrigida.'})+
    '</div></div>'+

    '<div class="sec grade-2">'+
      distribuir('faixa', 'Honorário por faixa do Simples', 'honorario',
        'Ordenado pelo número da faixa, não pelo valor — assim dá para ler a '+
        'escala de ponta a ponta. A faixa vem do RBT12 (12 meses fechando em '+
        compDisplay(periodoAtual().ate)+'), porque é assim que o Simples define. '+
        'O período muda o faturamento e quem aparece como sem faturar, não a faixa.',
        'faixa')+
      distribuir('planoIndicado', 'Honorário por plano indicado')+
    '</div>'+

    '<div class="sec grade-2">'+
      distribuir('grupoHonorario', 'Honorário por grupo da régua')+
      distribuir('fiscal', 'Carteira por fiscal responsável')+
    '</div>'+

    '<div class="sec grade-2">'+
      distribuir('tributacao', 'Regime tributário', 'honorario',
        'Barra = honorário do regime. Clique na quantidade para listar e exportar.') +
      distribuir(function(e){ return e.ramo || 'Sem ramo'; }, 'Honorário por ramo')+
    '</div>'+

    // Faturamento por segmento: a barra mede RBT12, não honorário — é onde o
    // dinheiro do cliente está, não o nosso.
    '<div class="sec grade-2">'+
      distribuir(function(e){ return e.tipo || e.segmento || 'Sem segmento'; },
        'Faturamento por segmento', 'rbt12',
        'Barra = RBT12 somado do segmento. Clique na quantidade para listar e exportar.')+
      distribuir(function(e){ return e.cidade || 'Sem cidade'; },
        'Faturamento por cidade', 'rbt12')+
    '</div>'+

    '<div class="sec"><div class="sec-tit">Maior defasagem absoluta '+
      '<span class="leve">quanto falta para o piso do plano</span></div>'+
      '<div class="tab-caixa"><table><thead><tr>'+
        '<th>Empresa</th><th>Faixa</th><th>Plano indicado</th>'+
        '<th>Fat. no período</th><th>RBT12</th><th>Média/mês</th><th>Honorário</th><th>Piso</th>'+
        '<th>Defasagem</th><th>Ao ano</th>'+
      '</tr></thead><tbody>'+
      abaixo.slice().sort(function(a,b){
        return (num(b.pisoPlano)-num(b.honorarioAtual)) - (num(a.pisoPlano)-num(a.honorarioAtual));
      }).slice(0,50).map(function(e){
        var d = num(e.pisoPlano)-num(e.honorarioAtual);
        return '<tr class="clicavel" onclick="location.hash=\'#/empresa/'+e.cnpj+'\'">'+
          '<td><div class="cel-emp"><span class="cel-nome">'+esc(e.empresa)+'</span>'+
          '<span class="cel-cnpj">'+esc(e.cnpjFmt)+'</span></div></td>'+
          '<td style="font-size:12px;">'+esc(faixaDe(e))+'</td>'+
          '<td style="font-size:12px;">'+esc(e.planoIndicado||'—')+'</td>'+
          '<td class="mono">'+fmtCurto(e.fatPeriodo)+'</td>'+
          celRbt(e)+ celMedia(e)+
          celHonorario(e)+
          '<td class="mono">'+fmtBRL(e.pisoPlano)+'</td>'+
          '<td class="mono" style="color:var(--erro);font-weight:700;">'+fmtBRL(d)+'</td>'+
          '<td class="mono">'+fmtBRL(d*12)+'</td></tr>';
      }).join('')+'</tbody></table></div>'+
      '<div class="acoes" style="margin-top:10px;">'+
        '<button class="btn" id="ca-exp">Exportar defasagem completa</button>'+
        '<span class="dica">Tabela mostra os 50 maiores; a exportação leva os '+
        fmtNum(abaixo.length)+'.</span>'+
      '</div>'+
    '</div>';

  document.getElementById('ca-exp').onclick = function(){
    exportar('Defasagem_Carteira', 'Defasagem',
      ['CNPJ','Empresa','Faixa','Plano indicado','RBT12','Média mensal','Honorário','Piso do plano','Defasagem','Defasagem anual'],
      abaixo.map(function(e){
        var d = num(e.pisoPlano)-num(e.honorarioAtual);
        return [e.cnpjFmt, e.empresa, faixaDe(e), e.planoIndicado||'', num(e.rbt12), num(e.rbt12)/12,
                num(e.honorarioAtual), num(e.pisoPlano), d, d*12];
      }), this);
  };
}

/* ===========================================================================
   DRILL-DOWN — clicar num número e ver as empresas por trás dele
   ---------------------------------------------------------------------------
   Um número solto ("979 empresas", "1.035 abaixo do piso") não se audita.
   abrirLista() é o caminho único: qualquer contagem ou soma da plataforma
   abre a mesma janela, com as mesmas colunas, a mesma busca e o mesmo botão
   de Excel. Não existe indicador que o usuário veja e não consiga abrir.
   =========================================================================== */

/* Colunas padrão. Cada item: [cabeçalho, função, éNúmero] */
/**
 * Colunas do pop-up "vencidos ha mais de 90 dias". Troca piso/defasagem por
 * faturamento recente: com 90 dias de atraso a pergunta ja nao e "cobra pouco?"
 * e sim "essa empresa ainda esta viva?".
 */
function colunas90(){
  return [
    ['Empresa',        function(e){ return e.empresa; },              false],
    ['CNPJ',           function(e){ return e.cnpjFmt; },              false],
    ['Vencido',        function(e){ return num(e.valorVencido); },    true],
    ['Títulos',        function(e){ return num(e.titulosVencidos); }, true, 'qtd'],
    ['Maior atraso',   function(e){ return num(e.maiorAtraso)+' d'; },false],
    ['Faturamento 90d',function(e){ return num(e.fat90); },           true],
    ['Média/mês',      function(e){ return num(e.rbt12)/12; },        true],
    ['RBT12',          function(e){ return num(e.rbt12); },           true],
    ['Honorário',      function(e){ return e.naoCobramos ? SEM_COBRANCA : num(e.honorarioAtual); }, true],
    ['Situação',       function(e){ return num(e.fat90) ? 'Faturando' : 'Sem faturar há 90d'; }, false]
  ];
}

function colunasPadrao(){
  return [
    ['Empresa',      function(e){ return e.empresa; },        false],
    ['CNPJ',         function(e){ return e.cnpjFmt; },        false],
    ['Faixa',        function(e){ return faixaDe(e); },       false],
    ['Regime',       function(e){ return e.tributacao||'—'; },false],
    ['RBT12',        function(e){ return num(e.rbt12); },     true],
    ['Média/mês',    function(e){ return num(e.rbt12)/12; },   true],
    ['Honorário',    function(e){ return e.naoCobramos ? SEM_COBRANCA : num(e.honorarioAtual); }, true],
    ['Piso do plano',function(e){ return num(e.pisoPlano); }, true],
    ['Defasagem',    function(e){ return num(e.pisoPlano)-num(e.honorarioAtual); }, true],
    ['Fiscal',       function(e){ return e.fiscal||'—'; },    false]
  ];
}

/**
 * Janela com a lista de empresas por trás de um número.
 * @param {string} titulo  cabeçalho da janela
 * @param {Array}  lista   empresas já filtradas
 * @param {Object} opcoes  {subtitulo, colunas, arquivo}
 */
function abrirLista(titulo, lista, opcoes){
  opcoes = opcoes || {};
  var cols = opcoes.colunas || colunasPadrao();
  var arquivo = opcoes.arquivo || titulo.replace(/[^\w]+/g,'_').slice(0,40);
  var filtrada = lista.slice();

  var corpo =
    (opcoes.subtitulo ? '<div class="aviso aviso-info" style="margin-bottom:12px;">'+
      '<span class="aviso-ico">i</span><div>'+opcoes.subtitulo+'</div></div>' : '')+
    '<div class="filtros" style="margin-bottom:10px;">'+
      '<input type="search" id="dl-busca" placeholder="Buscar nesta lista…" style="min-width:220px;">'+
      '<span class="espaco"></span>'+
      '<span class="dica" id="dl-cont" style="margin:0;"></span>'+
    '</div>'+
    '<div class="tab-caixa" style="max-height:50vh;overflow:auto;"><table><thead><tr>'+
      cols.map(function(c){ return '<th'+(c[2]?' class="num"':'')+'>'+esc(c[0])+'</th>'; }).join('')+
      '<th></th></tr></thead><tbody id="dl-corpo"></tbody></table></div>';

  abrirModal(titulo, corpo, [
    {rot:'Exportar Excel', primario:true, aoClicar:function(b){
      exportar(arquivo, titulo.slice(0,28),
        cols.map(function(c){ return c[0]; }),
        filtrada.map(function(e){ return cols.map(function(c){ return c[1](e); }); }), b);
    }}
  ], true);

  function celula(c, e){
    var v = c[1](e);
    // O RBT12 tambem e porta de entrada aqui dentro: fechar a lista e reabrir
    // o mes a mes evita que o usuario perca a pergunta que estava fazendo.
    if(c[0] === 'RBT12' && num(v) > 0){
      return '<td class="mono"><button type="button" class="num-link" '+
        'onclick="fecharModal();detalharRBT12(\''+esc(e.cnpj)+'\')" '+
        'title="Ver o mês a mês">'+fmtBRL(v)+'</button></td>';
    }
    // c[3]==='qtd' marca contagem: sem isso o numero de titulos saia "R$ 5,00".
    if(c[3] === 'qtd') return '<td class="mono">'+fmtNum(v)+'</td>';
    if(c[2]) return '<td class="mono">'+(typeof v === 'number' ? fmtBRL(v) : esc(v))+'</td>';
    return '<td style="font-size:12px;">'+esc(v)+'</td>';
  }
  if(!lista.length){
    var vazio = document.getElementById('dl-corpo');
    if(vazio) vazio.innerHTML = '<tr><td colspan="'+(cols.length+1)+'"><div class="vazio">'+
      'Nenhuma empresa da base atende a este corte.'+
      '<div class="dica" style="margin-top:6px;">Se o número acima é maior que zero, ele vem '+
      'de um agregado calculado com outro critério — vale conferir a importação.</div></div></td></tr>';
    return;
  }
  function pintar(){
    var termo = (document.getElementById('dl-busca').value||'').toLowerCase().trim();
    filtrada = lista.filter(function(e){
      if(!termo) return true;
      return casaBusca(e, termo);
    });
    document.getElementById('dl-corpo').innerHTML = filtrada.slice(0,300).map(function(e){
      return '<tr>'+ cols.map(function(c){ return celula(c,e); }).join('')+
        '<td><button class="btn btn-p btn-fantasma" onclick="fecharModal();location.hash=\'#/empresa/'+
        e.cnpj+'\'">Ficha →</button></td></tr>';
    }).join('') || '<tr><td colspan="'+(cols.length+1)+'"><div class="vazio">Nada encontrado.</div></td></tr>';
    document.getElementById('dl-cont').textContent =
      'Mostrando '+Math.min(filtrada.length,300)+' de '+fmtNum(filtrada.length)+
      (filtrada.length>300 ? ' — a exportação leva todas' : '');
  }
  document.getElementById('dl-busca').addEventListener('input', pintar);
  pintar();
}

/* O HTML guarda só uma chave curta; a lista fica aqui, porque objeto de
   empresa não cabe num atributo onclick. Zerado a cada troca de tela. */
var DRILL = {};
var DRILL_SEQ = 0;
function limparDrill(){ DRILL = {}; DRILL_SEQ = 0; }

/** HTML de um número clicável que abre a lista por trás dele. */
function numClicavel(texto, titulo, lista, opcoes){
  // Antes, lista vazia devolvia texto puro — o número deixava de ser clicável
  // sem avisar, e parecia que o recurso não existia. Agora o botão aparece
  // sempre e a janela explica por que está vazia.
  var chave = 'd'+(++DRILL_SEQ);
  DRILL[chave] = {titulo:titulo, lista:lista, opcoes:opcoes||{}};
  return '<button type="button" class="num-link" onclick="abrirDrill(\''+chave+'\')" '+
         'title="Ver as '+fmtNum(lista.length)+' empresas">'+esc(String(texto))+'</button>';
}
function abrirDrill(chave){
  var d = DRILL[chave];
  if(d) abrirLista(d.titulo, d.lista, d.opcoes);
}

/** Indicador (cartão) que abre a lista ao ser clicado. */
function indLista(rot, val, sub, classe, titulo, lista, opcoes){
  var chave = 'd'+(++DRILL_SEQ);
  DRILL[chave] = {titulo:titulo||rot, lista:lista, opcoes:opcoes||{}};
  return '<div class="ind '+(classe||'')+' link" role="button" tabindex="0" '+
    'onclick="abrirDrill(\''+chave+'\')" '+
    'onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();abrirDrill(\''+chave+'\')}">'+
    '<div class="ind-rot">'+esc(rot)+'</div>'+
    '<div class="ind-val">'+val+'</div>'+
    (sub ? '<div class="ind-sub">'+sub+'</div>' : '')+'</div>';
}

/* ===========================================================================
   TELA — NOTAS EMITIDAS PELA EXEMPLO
   ---------------------------------------------------------------------------
   Três perguntas, nesta ordem:
     1. De quem emitimos nota e quanto do faturamento dele passa por nós?
        Quanto maior o percentual, mais o cliente depende do nosso serviço —
        e mais frágil fica o argumento de que o honorário está caro.
     2. O volume está crescendo? Se cresce e o honorário não acompanha, é
        trabalho a mais pelo mesmo preço.
     3. Quem tem dependência alta E paga abaixo do piso? Essa é a fila.

   Os dados vêm ao vivo da planilha "Notas Exemplo" — não é cópia.
   =========================================================================== */
var NOTAS = null;
var NOTAS_TUDO = null;
var NOTAS_PERIODO = null;

function telaNotasEscr(){
  // Primeiro carrega tudo, para saber quais competências existem; depois
  // recorta pelo intervalo escolhido, sem voltar ao servidor.
  if(!NOTAS_TUDO){
    document.getElementById('conteudo').innerHTML =
      '<div class="carregando"><div class="giro"></div>Lendo a planilha Notas Exemplo…</div>';
    chamar('api_notasEscr', ['',''], function(res){ NOTAS_TUDO = res; roteador(); },
      function(){
        document.getElementById('conteudo').innerHTML =
          '<div class="vazio"><div class="vazio-ico">!</div>Não consegui ler a planilha Notas Exemplo.'+
          '<div class="dica" style="margin-top:8px;">A conta que roda o Monitor precisa ter '+
          'acesso à planilha.</div></div>';
      });
    return;
  }
  desenharPeriodo();
  var f = faixaConsulta(NOTAS_TUDO.meses || []);
  var chave = f.de + '-' + f.ate;
  if(NOTAS && NOTAS_PERIODO === chave){ pintarNotas(); return; }

  document.getElementById('conteudo').innerHTML =
    '<div class="carregando"><div class="giro"></div>Recortando o período…</div>';
  chamar('api_notasEscr', [f.de, f.ate], function(res){
    NOTAS = res; NOTAS_PERIODO = chave; pintarNotas();
  }, function(){
    document.getElementById('conteudo').innerHTML =
      '<div class="vazio"><div class="vazio-ico">!</div>Não consegui ler a planilha Notas Exemplo.'+
      '<div class="dica" style="margin-top:8px;">A conta que roda o Monitor precisa ter acesso '+
      'à planilha. Peça o compartilhamento ao Colaborador 46.</div>'+
      '<div style="margin-top:12px;"><button class="btn btn-1" onclick="NOTAS=null;roteador()">'+
      'Tentar de novo</button></div></div>';
  });
}

function pintarNotas(){
  var d = NOTAS;
  var lista = d.lista || [], serie = d.serie || [];
  var totQtd = lista.reduce(function(a,x){ return a+num(x.notasQtd); },0);
  var totVal = lista.reduce(function(a,x){ return a+num(x.notasValor); },0);
  var meses = serie.length || 1;

  var comPct = lista.filter(function(x){ return x.pctEmitido !== null; });
  var dep100 = comPct.filter(function(x){ return x.pctEmitido >= 0.99; });
  var depAlta = comPct.filter(function(x){ return x.pctEmitido >= 0.5 && x.pctEmitido < 0.99; });
  var foraBase = lista.filter(function(x){ return !x.naBase; });

  // Crescimento: primeira metade do período contra a segunda.
  var meio = Math.floor(serie.length/2);
  var ini = serie.slice(0, meio).reduce(function(a,x){ return a+num(x.qtd); },0);
  var fim = serie.slice(meio).reduce(function(a,x){ return a+num(x.qtd); },0);
  var cresc = ini ? (fim-ini)/ini : null;

  // A fila: depende de nós e paga abaixo do piso.
  var fila = lista.filter(function(x){
    return x.pctEmitido !== null && x.pctEmitido >= 0.5 &&
           num(x.piso) > 0 && num(x.honorario) < num(x.piso);
  }).sort(function(a,b){ return b.pctEmitido - a.pctEmitido; });
  var ganhoFila = fila.reduce(function(a,x){ return a + (num(x.piso)-num(x.honorario)); },0);

  var maxQtd = Math.max.apply(null, serie.map(function(x){ return num(x.qtd); }).concat([1]));

  document.getElementById('topo-meta').textContent =
    fmtNum(lista.length)+' clientes com nota · '+rotuloConsulta((NOTAS_TUDO||{}).meses||[]);
  document.getElementById('topo-acoes').innerHTML =
    '<button class="btn btn-fantasma btn-p" id="nt-recarregar">Atualizar da planilha</button>';

  document.getElementById('conteudo').innerHTML =
    '<div class="aviso aviso-info"><span class="aviso-ico">i</span><div>'+
    'Lido ao vivo da planilha <b>Notas Exemplo</b> ('+fmtNum((d.meta||{}).linhas)+' notas, '+
    fmtNum((d.meta||{}).empresasNaPlanilha)+' empresas) em '+fmtDataHora((d.meta||{}).lidoEm)+'. '+
    'O <b>% emitido</b> compara o valor que emitimos com o faturamento declarado pelo cliente '+
    'no mesmo intervalo.</div></div>'+

    '<div class="sec"><div class="ind-grade">'+
      indLista('Notas no período', fmtNum(totQtd), fmtNum(Math.round(totQtd/meses))+' por mês', '',
        'Clientes por volume de notas',
        paraEmpresas(lista.slice().sort(function(a,b){ return num(b.qtd)-num(a.qtd); })),
        {subtitulo:fmtNum(totQtd)+' notas no período, '+fmtNum(Math.round(totQtd/meses))+' por mês em média.'})+
      indLista('Valor emitido', fmtCurto(totVal), rotuloConsulta((NOTAS_TUDO||{}).meses||[]), '',
        'Clientes por valor emitido',
        paraEmpresas(lista.slice().sort(function(a,b){ return num(b.valor)-num(a.valor); })),
        {subtitulo:'Somamos '+fmtBRL(totVal)+' em notas emitidas no período.'})+
      indLista('Clientes atendidos', fmtNum(lista.length),
        'com ao menos uma nota', '', 'Clientes com nota emitida', paraEmpresas(lista))+
      indLista('Emitimos 100%', fmtNum(dep100.length),
        'todo o faturamento passa por nós', 'alerta',
        'Dependência total da nossa emissão', paraEmpresas(dep100),
        {subtitulo:'O faturamento declarado veio inteiro das notas que emitimos.'})+
      indLista('Dependência alta', fmtNum(depAlta.length),
        'entre 50% e 99% do faturamento', 'laranja',
        'Dependência alta', paraEmpresas(depAlta))+
      indLista('Volume', cresc===null?'—':fmtPct(cresc,0),
        cresc===null?'período curto demais':'2ª metade contra a 1ª',
        cresc!==null && cresc<0 ? 'neutro' : '',
        'Clientes por volume de notas', paraEmpresas(lista),
        {subtitulo:cresc===null
          ? 'O período escolhido não tem metades comparáveis.'
          : 'A segunda metade do período emitiu '+fmtPct(cresc,0)+' em relação à primeira.'})+
    '</div></div>'+

    (fila.length ?
    '<div class="aviso aviso-atencao"><span class="aviso-ico">!</span><div>'+
      '<b>'+fmtNum(fila.length)+' clientes</b> dependem da nossa emissão (50% ou mais do '+
      'faturamento) <b>e</b> pagam abaixo do piso do plano. Corrigir só esses vale '+
      fmtBRL(ganhoFila)+'/mês — '+fmtBRL(ganhoFila*12)+'/ano.</div></div>' : '')+

    '<div class="sec"><div class="sec-tit">Volume por competência '+
      '<span class="leve">'+periodoIntervalo()+'</span></div>'+
      '<div class="cartao" style="padding:16px 18px;">'+ (serie.length ?
      serie.map(function(x){
        return '<div class="barra-lin"><span class="barra-rot">'+esc(x.competencia)+'</span>'+
          '<div class="barra-trilho"><div class="barra-preenche" style="width:'+
          (num(x.qtd)/maxQtd*100).toFixed(1)+'%;background:var(--info)"></div></div>'+
          '<span class="barra-val">'+fmtCurto(x.valor)+'</span>'+
          '<span class="barra-num">'+fmtNum(x.qtd)+'</span></div>';
      }).join('') : '<div class="vazio">Nenhuma nota neste período.</div>')+'</div>'+
      '<div class="dica" style="margin-top:8px;">Barra = quantidade de notas · '+
      'valor à direita = total emitido no mês.</div></div>'+

    '<div class="sec"><div class="sec-tit">Clientes para quem emitimos '+
      '<span class="leve">maior volume primeiro</span></div>'+
      '<div class="filtros">'+
        '<input type="search" id="nf-busca" placeholder="Buscar empresa ou CNPJ…">'+
        selectGrupo('nf-grupo')+
        '<select id="nf-dep"><option value="">Toda dependência</option>'+
          '<option value="100">Emitimos 100%</option>'+
          '<option value="alta">50% ou mais</option>'+
          '<option value="media">Entre 20% e 50%</option>'+
          '<option value="baixa">Abaixo de 20%</option>'+
          '<option value="semfat">Sem faturamento declarado</option></select>'+
        '<select id="nf-piso"><option value="">Todos</option>'+
          '<option value="abaixo">Só abaixo do piso</option></select>'+
        '<span class="espaco"></span>'+
        '<button class="btn" id="nf-exp">Exportar</button>'+
      '</div>'+
      '<div class="tab-caixa"><table><thead><tr>'+
        '<th>Empresa</th><th>Notas</th><th>Valor emitido</th><th>Faturamento</th>'+
        '<th>% emitido</th><th>Honorário</th><th>Piso</th><th>Situação</th>'+
      '</tr></thead><tbody id="nf-corpo"></tbody></table>'+
      '<div class="paginacao"><span id="nf-cont"></span></div></div>'+
      (foraBase.length ? '<div class="dica" style="margin-top:8px;">'+
        fmtNum(foraBase.length)+' CNPJ(s) da planilha de notas não estão no Tabelão — '+
        'aparecem como "(fora do Tabelão)" e sem honorário.</div>' : '')+
    '</div>';

  function pintar(){
    var termo = (document.getElementById('nf-busca').value||'').toLowerCase().trim();
    var dep = document.getElementById('nf-dep').value;
    var soAbaixo = document.getElementById('nf-piso').value === 'abaixo';
    var grupo = (document.getElementById('nf-grupo')||{}).value || '';
    var f = lista.filter(function(x){
      var p = x.pctEmitido;
      // A linha de Notas traz o CNPJ; o grupo vem da ficha da empresa na base.
      if(grupo && !casaGrupo(S.porCnpj[x.cnpj] || {}, grupo)) return false;
      if(dep === '100'   && !(p !== null && p >= 0.99)) return false;
      if(dep === 'alta'  && !(p !== null && p >= 0.5)) return false;
      if(dep === 'media' && !(p !== null && p >= 0.2 && p < 0.5)) return false;
      if(dep === 'baixa' && !(p !== null && p < 0.2)) return false;
      if(dep === 'semfat'&& p !== null) return false;
      if(soAbaixo && !(num(x.piso) > 0 && num(x.honorario) < num(x.piso))) return false;
      if(!termo) return true;
      return casaBusca(x, termo);
    });
    document.getElementById('nf-corpo').innerHTML = f.slice(0,200).map(function(x){
      var abaixo = num(x.piso) > 0 && num(x.honorario) < num(x.piso);
      var p = x.pctEmitido;
      var cor = p === null ? 'var(--texto-fraco)'
              : p >= 0.99 ? 'var(--erro)' : p >= 0.5 ? 'var(--alerta)' : 'var(--texto)';
      return '<tr'+(x.naBase?' class="clicavel" onclick="location.hash=\'#/empresa/'+x.cnpj+'\'"':'')+'>'+
        '<td><div class="cel-emp"><span class="cel-nome">'+esc(x.empresa)+'</span>'+
        '<span class="cel-cnpj">'+esc(x.cnpjFmt)+'</span></div></td>'+
        '<td class="mono">'+fmtNum(x.notasQtd)+'</td>'+
        '<td class="mono">'+fmtBRL(x.notasValor)+'</td>'+
        '<td class="mono">'+(x.faturamento?fmtBRL(x.faturamento):'—')+'</td>'+
        '<td class="mono" style="color:'+cor+';font-weight:700;">'+
          (p===null?'sem base':fmtPct(p,0))+'</td>'+
        '<td class="mono">'+(x.honorario?fmtBRL(x.honorario):'—')+'</td>'+
        '<td class="mono">'+(x.piso?fmtBRL(x.piso):'—')+'</td>'+
        '<td>'+(!x.naBase ? '<span class="selo selo-neutro">fora do Tabelão</span>'
               : abaixo ? '<span class="selo selo-alerta">abaixo do piso</span>'
                        : '<span class="selo selo-ok">no piso</span>')+'</td></tr>';
    }).join('') || '<tr><td colspan="8"><div class="vazio">Nenhum cliente com os filtros atuais.</div></td></tr>';
    document.getElementById('nf-cont').textContent =
      'Mostrando '+Math.min(f.length,200)+' de '+fmtNum(f.length);
    document.getElementById('nf-exp').onclick = function(){
      exportar('Notas_Exemplo', 'Notas',
        ['CNPJ','Empresa','Notas','Valor emitido','Faturamento','% emitido',
         'Honorário','Piso do plano','Plano','Faixa','Fiscal'],
        f.map(function(x){
          return [x.cnpjFmt, x.empresa, x.notasQtd, x.notasValor, x.faturamento,
                  x.pctEmitido===null?'':Number((x.pctEmitido*100).toFixed(2)),
                  x.honorario||'', x.piso||'', x.plano||'', x.faixa||'', x.fiscal||''];
        }), this);
    };
  }
  document.getElementById('nf-busca').addEventListener('input', pintar);
  document.getElementById('nf-dep').addEventListener('change', pintar);
  document.getElementById('nf-piso').addEventListener('change', pintar);
  ligarGrupo('nf-grupo', pintar);
  document.getElementById('nt-recarregar').addEventListener('click', function(){
    var b = this; ocupado(b, true);
    chamar('api_recarregarNotas', [], function(res){
      ocupado(b,false); avisar(res.mensagem,'ok'); NOTAS=null; roteador();
    }, function(){ ocupado(b,false); });
  });
  pintar();
}

/* ---------------------------------------------------------------------------
   Notas por ano, vindas SEMPRE da planilha Notas Exemplo.
   O faturamento continua vindo do Demonstrativo da Domínio; nota é outra
   fonte e não pode sair do agregado do histórico, que não a tem completa.
   Carrega uma vez e fica em memória.
   --------------------------------------------------------------------------- */
var NOTAS_ANO = null;
function carregarNotasAno(aoPronto){
  if(NOTAS_ANO){ if(aoPronto) aoPronto(); return; }
  chamar('api_notasEscr', ['',''], function(res){
    NOTAS_ANO = {};
    (res.lista||[]).forEach(function(x){ NOTAS_ANO[x.cnpj] = {}; });
    (res.serie||[]).length;          // série global não serve aqui
    // recompõe por ano a partir do detalhe de cada empresa
    (res.porAno||[]).forEach(function(r){
      NOTAS_ANO[r.cnpj] = r.anos;
    });
    if(aoPronto) aoPronto();
  }, function(){ NOTAS_ANO = {}; if(aoPronto) aoPronto(); });
}
function notasAno(cnpj, ano){
  if(!NOTAS_ANO) return null;
  var e = NOTAS_ANO[cnpj];
  return (e && e[ano]) ? e[ano][0] : (e ? 0 : null);
}
function notasValorAno(cnpj, ano){
  if(!NOTAS_ANO) return null;
  var e = NOTAS_ANO[cnpj];
  return (e && e[ano]) ? e[ano][1] : (e ? 0 : null);
}

/** Linhas de notas -> objetos de empresa, para a janela de lista funcionar. */
function paraEmpresas(linhas){
  return linhas.map(function(x){ return S.porCnpj[x.cnpj]; }).filter(Boolean);
}

function exportar(nome, aba, cabecalho, linhas, botao){
  if(!linhas || !linhas.length){ avisar('Nada a exportar com os filtros atuais.','atencao'); return; }
  ocupado(botao, true);
  chamar('api_exportar', [nome, aba, cabecalho, linhas], function(res){
    ocupado(botao, false);
    abrirModal('Arquivo pronto',
      '<div class="aviso aviso-ok"><span class="aviso-ico">✓</span><div>'+
      '<b>'+esc(res.nome)+'</b> com '+fmtNum(res.linhas)+' linha(s), salvo na pasta '+
      '"Monitor de Honorários — Exportações" no seu Drive.</div></div>'+
      '<div style="text-align:center;padding:8px 0;">'+
      '<a class="btn btn-1" href="'+esc(res.url)+'" target="_blank" rel="noopener">Abrir no Drive</a></div>', []);
  }, function(){ ocupado(botao, false); });
}

/* ===========================================================================
   PRECIFICAÇÃO: CALCULADORA DE HONORÁRIOS (v4.2.0)
   ---------------------------------------------------------------------------
   Base: "Tabela de Preços - Exemplo 2026" (base comercial, 25/09).
   A tabela define o honorário em % do salário mínimo (ou valor fixo) por
   atividade, regime, funcionários e faturamento MENSAL, com três preços:
   tabela, promocional e mínimo. Em cima dela entram os adicionais da aba
   Particularidades, o RH+ e os serviços extras.

   Onde a tabela comercial não tem linha para o perfil do cliente, a
   calculadora usa a linha mais próxima e AVISA. Onde a tabela manda
   "reunião", a calculadora não inventa preço.

   O cálculo roda no navegador, igual no artefato e no Apps Script. O
   servidor só guarda diretrizes e testes (Calculadora.gs).
   =========================================================================== */

function precSM(){ return num(S.config && S.config.salario_minimo) || 1621; }
function precD(ch){ return PREC.diretrizes[ch]; }
function precV(ch){
  var d = precD(ch);
  if(d && d.valor !== undefined && d.valor !== null && d.valor !== '') { var v = Number(d.valor); if(!isNaN(v)) return v; }
  if(PREC_PADRAO[ch]) return PREC_PADRAO[ch][3];
  var m = /^(.*)\.(p|m)$/.exec(ch), r = PREC_TAB[m ? m[1] : ch];
  if(!r) return 0;
  return m ? (m[2] === 'p' ? r[10] : r[11]) : r[9];
}
/* promocional/mínimo em branco na planilha ficam "regra geral" (null) */
function precVOpc(ch){
  var d = precD(ch);
  if(d && (d.valor === '' || d.valor === null)) return null;
  if(d && d.valor !== undefined) return Number(d.valor);
  return precV(ch);
}
function precStatus(ch){ var d = precD(ch); return (d && d.status) || 'Provisório'; }
function precTodasChaves(){
  return PREC_TABELA.map(function(r){ return r[0]; }).concat(PREC_REGRAS.map(function(r){ return r[0]; }));
}
function precProvisorias(){
  return precTodasChaves().filter(function(ch){ return precStatus(ch) !== 'Validado'; }).length;
}

/* ------------------------------------------------------ dados da empresa */
function precRegimeDe(e){
  var t = String(e.tributacao || '').toLowerCase().trim();
  if(/presumido/.test(t) || t === 'lp' || t === 'p') return 'LP';
  if(/real/.test(t) || t === 'lr' || t === 'r') return 'LR';
  return 'SN';
}
function precAtivDe(e){
  var t = String(e.tipo || e.segmento || '').toLowerCase();
  if(/com[eé]rcio|varejo|atacad|loja|ind[uú]stria/.test(t)) return 'comercio';
  if(/patrimonial/.test(t)) return 'patrimonial';
  if(/sa[uú]de|m[eé]dic/.test(t)) return 'medico';
  return 'servico';
}
/* RBT12 real: 12 meses fechando na última competência da base, sem depender
   do período escolhido em outra tela (o período reescreve e.rbt12). */
function precRbt12(cnpj){
  if(SERIES && SERIES.serieEmpresa && SERIES.meses){
    var ult = SERIES.meses.length - 1, soma = 0;
    (SERIES.serieEmpresa[cnpj] || []).forEach(function(p){
      if(p[0] > ult - 12 && p[0] <= ult) soma += p[1] || 0;
    });
    return Math.round(soma * 100) / 100;
  }
  var e = S.porCnpj[cnpj];
  return e ? num(e.rbt12) : 0;
}
function precNotasMes(e){
  if(e._notas && e._notas.length){
    var ult = e._notas.slice().sort(function(a,b){ return a.competencia < b.competencia ? -1 : 1; }).slice(-3);
    return Math.round(ult.reduce(function(a,n){ return a + (n.qtd || 0); }, 0) / ult.length);
  }
  if(SERIES && SERIES.porEmpresa && SERIES.porEmpresa[e.cnpj]){
    var anos = Object.keys(SERIES.porEmpresa[e.cnpj]).sort();
    var a = SERIES.porEmpresa[e.cnpj][anos[anos.length - 1]];
    if(a && a[4]) return Math.round((a[1] || 0) / a[4]);
  }
  return 0;
}
function precOutrosEstab(e){
  var raiz = String(e.cnpj || '').slice(0, 8), soma = 0, qtd = 0;
  if(raiz.length < 8) return {rbt:0, qtd:0};
  ativos().forEach(function(z){
    if(z.cnpj !== e.cnpj && String(z.cnpj).slice(0, 8) === raiz){ soma += precRbt12(z.cnpj); qtd++; }
  });
  return {rbt:Math.round(soma * 100) / 100, qtd:qtd};
}
function precEntradaVazia(){
  return { cnpj:'', empresa:'', ativ:'servico', regime:'SN', rbt12:0, outrosRbt:0, outrosQtd:0,
    funcionarios:0, funcDaBase:false, notasMes:0, part:{}, rhmais:false, bpo:false, visitas:'nenhuma',
    extraValor:0, extraDesc:'', inad:false, pend:false, complexidade:'baixa', atual:null };
}
function precEntradaDe(e){
  var o = precOutrosEstab(e);
  return Object.assign(precEntradaVazia(), {
    cnpj:e.cnpj, empresa:e.empresa, ativ:precAtivDe(e), regime:precRegimeDe(e),
    rbt12:precRbt12(e.cnpj), outrosRbt:o.rbt, outrosQtd:o.qtd,
    funcionarios:num(e.qtdFuncionarios), funcDaBase:!!e.qtdFuncionarios, notasMes:precNotasMes(e),
    inad:num(e.valorVencido) > 0, pend:!!e.pendenciaFiscal,
    atual:e.naoCobramos ? null : e.honorarioAtual
  });
}

/* ------------------------------------------------ escolha da linha da tabela */
function precLinha(ativ, regime, func, fatMes){
  function dentro(v, a, b){ return v >= a && v <= b; }
  function dist(v, a, b){ return v < a ? a - v : v > b ? v - b : 0; }
  function candidatas(at){
    return PREC_TABELA.filter(function(r){ return r[1] === at && (r[2] === '*' || r[2] === regime); });
  }
  var todas = candidatas(ativ);
  var reuniao = todas.filter(function(r){ return r[8] === 'reuniao' &&
    (dentro(func, r[3], r[4]) || dentro(fatMes, r[5], r[6])); })[0];
  if(reuniao) return {linha:reuniao, exata:true, usouServico:false};
  var lista = todas.filter(function(r){ return r[8] !== 'reuniao'; }), usouServico = false;
  var exata = lista.filter(function(r){ return dentro(func, r[3], r[4]) && dentro(fatMes, r[5], r[6]); })[0];
  if(!exata && ativ === 'medico'){ return precLinhaMedico(regime, func, fatMes); }
  if(exata) return {linha:exata, exata:true, usouServico:usouServico};
  if(!lista.length) return {linha:null, exata:false, usouServico:usouServico};
  /* Sem linha exata: a mais próxima. Funcionário pesa mais que faturamento,
     porque muda o trabalho da folha; 1 funcionário ~ R$ 20 mil de faturamento. */
  var melhor = null, menor = INF;
  lista.forEach(function(r){
    var d = dist(func, r[3], r[4]) * 20000 + dist(fatMes, r[5], r[6]);
    if(d < menor){ menor = d; melhor = r; }
  });
  return {linha:melhor, exata:false, usouServico:usouServico};
}
function precLinhaMedico(regime, func, fatMes){
  var r = precLinha('servico', regime, func, fatMes);
  r.usouServico = true;
  return r;
}
function precMil(n){
  if(n >= 1e6) return 'R$ ' + String(Math.round(n / 1e5) / 10).replace('.', ',') + ' mi';
  return 'R$ ' + Math.round(n / 1000) + ' mil';
}
function precFaixaTxt(r){
  var f = r[4] >= INF ? (r[3] === 0 ? 'qualquer nº de func.' : 'mais de ' + (r[3] - 1) + ' func.') :
          r[4] === 0 ? 'sem funcionário' : (r[3] === r[4] ? r[3] : r[3] + ' a ' + r[4]) + ' func.';
  var fat = r[5] >= INF ? '' : r[6] === 0 ? 'sem faturamento' :
            r[6] >= INF ? (r[5] <= 0.01 ? 'qualquer faturamento' : 'acima de ' + precMil(Math.floor(r[5])) + '/mês') :
            (r[5] <= 0.01 ? 'até ' : precMil(Math.floor(r[5])) + ' a ') + precMil(r[6]) + '/mês';
  if(r[8] === 'reuniao' && r[3] > 0 && fat) return f + ' ou ' + fat;
  return fat ? f + ', ' + fat : f;
}
function precValorLinha(r, campo){
  var sm = precSM();
  var ch = r[0] + (campo === 'p' ? '.p' : campo === 'm' ? '.m' : '');
  var v = campo ? precVOpc(ch) : precV(ch);
  if(v === null || v === undefined || isNaN(v)) return null;
  return r[8] === 'pct' ? Math.floor(v / 100 * sm) : v;
}

/* ---------------------------------------------------------- motor de cálculo */
function precCalcular(x){
  var sm = precSM(), linhas = [], avisos = [], orient = [];
  function add(rot, val, det){ linhas.push({rot:rot, val:val, det:det || ''}); }
  var fatMes = num(x.rbt12) / 12;
  var func = num(x.funcionarios);
  var consol = num(x.rbt12) + num(x.outrosRbt);
  var esc = precLinha(x.ativ, x.regime, func, fatMes);
  var r = esc.linha;
  var res = { tabela:null, promo:null, minimo:null, reuniao:false, linha:r, exata:esc.exata,
              linhas:linhas, avisos:avisos, orient:orient, fatMes:fatMes };

  if(!r){ res.reuniao = true; avisos.push('A tabela não tem nenhuma linha para esta atividade e regime.'); return precFechar(res, x); }
  if(esc.usouServico) avisos.push('A tabela comercial só define médicos até R$ 30 mil/mês. Usei a tabela de serviço.');
  if(!esc.exata) avisos.push('A tabela não tem linha exata para ' + fmtNum(func) + ' funcionário(s) com ' +
    fmtBRL(fatMes) + '/mês. Usei a mais próxima: ' + precFaixaTxt(r) + '.');
  if(r[8] === 'reuniao'){
    res.reuniao = true;
    avisos.push('Pela tabela, este perfil precisa de reunião para definir preço (' + (r[12] || precFaixaTxt(r)) + ').');
    return precFechar(res, x);
  }

  var base = precValorLinha(r, ''), pr = precValorLinha(r, 'p'), mi = precValorLinha(r, 'm');
  if(pr === null) pr = Math.floor(base * precV('promo_pct') / 100);
  if(mi === null) mi = Math.floor(pr * precV('min_pct') / 100);
  add('Tabela: ' + PREC_ATIV[r[1]] + (r[2] !== '*' ? ' · ' + PREC_REG[r[2]] : ''), base,
    precFaixaTxt(r) + (r[8] === 'pct' ? ' · ' + String(precV(r[0])).replace('.', ',') + '% do SM' : ' · valor fixo'));
  var adic = 0;

  if((x.ativ === 'servico' || x.ativ === 'medico' || x.ativ === 'patrimonial') && r[4] === 0 && func >= 3){
    var k = func > 20 ? 'func_add_3' : func > 10 ? 'func_add_2' : 'func_add_1';
    var fa = Math.floor(base * precV(k) / 100);
    add('Adicional por funcionário', fa, fmtNum(func) + ' funcionários · +' + precV(k) + '%');
    adic += fa;
  }
  var limNotas = r[7] === null ? null : r[7];
  if(x.ativ !== 'comercio' && num(x.notasMes) > precV('nf_limite')){
    add('Emissão de notas', precV('nf_valor'), fmtNum(x.notasMes) + ' notas/mês, acima de ' + precV('nf_limite'));
    adic += precV('nf_valor');
  } else if(x.ativ === 'comercio' && limNotas !== null && num(x.notasMes) > limNotas){
    avisos.push(fmtNum(x.notasMes) + ' notas/mês passa do limite da linha (' + limNotas + '). A tabela não diz quanto cobrar a mais.');
  }
  PREC_PARTIC.forEach(function(p){
    if(!(x.part || {})[p[0]]) return;
    if(p[2]){ var v = Math.floor(precV(p[2]) / 100 * sm); add(p[1], v, precV(p[2]) + '% do SM · ' + p[3]); adic += v; }
    else orient.push(p[1] + ': ' + p[3]);
  });
  if(x.rhmais){
    if(func > 80) avisos.push('RH+ acima de 80 funcionários: preço especial com a diretoria.');
    else if(func < 1) avisos.push('RH+ marcado sem funcionários informados.');
    else {
      var kk = func <= 5 ? 'rh_1' : func <= 10 ? 'rh_2' : func <= 20 ? 'rh_3' : func <= 35 ? 'rh_4' : func <= 50 ? 'rh_5' : 'rh_6';
      add('RH+', precV(kk), fmtNum(func) + ' funcionários'); adic += precV(kk);
    }
  }
  if(x.bpo){
    if(precV('bpo_valor') > 0){ add('BPO financeiro', precV('bpo_valor'), 'valor mensal'); adic += precV('bpo_valor'); }
    else avisos.push('BPO marcado, mas ainda não tem preço definido.');
  }
  var vis = x.visitas === 'mensal' ? 1 : x.visitas === 'trimestral' ? 1/3 : 0;
  if(vis){
    if(precV('visita_valor') > 0){ var vv = Math.round(vis * precV('visita_valor') * 100) / 100;
      add('Visitas presenciais', vv, x.visitas === 'mensal' ? '1 por mês' : '1 a cada 3 meses'); adic += vv; }
    else avisos.push('Visitas presenciais marcadas, mas o valor da visita ainda não foi definido.');
  }
  if(num(x.extraValor) > 0){ add('Extra: ' + (x.extraDesc || 'sem descrição'), num(x.extraValor), 'informado'); adic += num(x.extraValor); }

  var pctRisco = 0, riscos = [];
  [['inad', x.inad, 'risco_inad', 'título vencido'], ['pend', x.pend, 'risco_pend', 'pendência fiscal'],
   ['m', x.complexidade === 'media', 'risco_media', 'complexidade média'],
   ['a', x.complexidade === 'alta', 'risco_alta', 'complexidade alta']].forEach(function(z){
    if(!z[1]) return;
    if(precV(z[2]) > 0){ pctRisco += precV(z[2]); riscos.push(z[3]); }
    else orient.push('Risco apontado (' + z[3] + '), ainda sem peso no preço.');
  });
  var somaSemRisco = base + adic;
  var vRisco = pctRisco ? Math.floor(somaSemRisco * pctRisco / 100) : 0;
  if(vRisco) add('Risco do cliente', vRisco, riscos.join(', ') + ' · +' + pctRisco + '%');

  if(x.regime === 'SN' && consol > precV('sublimite'))
    avisos.push('Faturamento de 12 meses ' + (num(x.outrosQtd) ? 'somando matriz e filiais ' : '') + '(' + fmtBRL(consol) +
      ') passa do sublimite. ICMS e ISS saem do DAS: pela orientação da gestão, o cliente vai para o Prime.');

  res.tabela = base + adic + vRisco;
  res.promo = pr + adic + vRisco;
  res.minimo = mi + adic + vRisco;
  return precFechar(res, x);
}
function precFechar(res, x){
  var atual = (x.atual === null || x.atual === undefined || x.atual === '') ? null : num(x.atual);
  res.atual = atual;
  res.sugerido = res.tabela;
  res.diferenca = (atual === null || res.tabela === null) ? null : res.tabela - atual;
  res.pct = (atual && res.diferenca !== null) ? res.diferenca / atual : null;
  res.faltaMinimo = (atual === null || res.minimo === null) ? null : Math.max(0, res.minimo - atual);
  res.situacao = res.reuniao ? 'Reunião'
    : atual === null ? 'Sem honorário'
    : atual < res.minimo ? 'Abaixo' : atual < res.tabela ? 'Negociado' : 'Na tabela';
  return res;
}
function precSelo(sit){
  var m = {Abaixo:['selo-alerta','Abaixo do mínimo'], Negociado:['selo-atencao','Entre mínimo e tabela'],
           'Na tabela':['selo-ok','Na tabela ou acima'], 'Reunião':['selo-info','Precisa de reunião'],
           'Sem honorário':['selo-neutro', window.PREC_SOLO ? 'Proposta' : 'Sem honorário']};
  var s = m[sit] || m['Sem honorário'];
  return '<span class="selo ' + s[0] + '">' + s[1] + '</span>';
}

/* -------------------------------------------- busca de cliente com sugestões
   Digita parte do nome, do CNPJ ou o código Domínio: aparecem até 8 empresas
   da base. Clicar (ou Enter) preenche a calculadora com os dados do cadastro. */
function precNorm(s){
  return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
}
function precBuscarEmpresas(termo){
  var t = precNorm(termo).trim();
  if(t.length < 2) return [];
  var dig = t.replace(/\D/g, ''), toks = t.split(/\s+/).filter(Boolean);
  var achadas = [];
  ativos().forEach(function(e){
    if(e._busca === undefined) e._busca = precNorm(e.empresa);
    var porNome = toks.every(function(k){ return e._busca.indexOf(k) >= 0; });
    var porNum = dig.length >= 3 && (String(e.cnpj).indexOf(dig) >= 0 || String(e.codigoDominio || '') === dig);
    if(!porNome && !porNum) return;
    var peso = e._busca.indexOf(toks[0] || '') === 0 ? 0 : porNome ? 1 : 2;
    achadas.push({e:e, peso:peso});
  });
  achadas.sort(function(a,b){ return a.peso - b.peso || String(a.e.empresa).localeCompare(String(b.e.empresa)); });
  return achadas.slice(0, 8).map(function(a){ return a.e; });
}
function precCampoCliente(x){
  var valor = x.empresa ? x.empresa + ' · ' + ((S.porCnpj[x.cnpj] || {}).cnpjFmt || '') : '';
  return '<div class="campo" style="margin-bottom:12px;position:relative;"><label for="pc-emp">Cliente da carteira</label>' +
    '<input id="pc-emp" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="pc-sug" ' +
      'placeholder="Digite o nome, CNPJ ou código Domínio" value="' + esc(valor) + '">' +
    '<div id="pc-sug" role="listbox" hidden style="position:absolute;left:0;right:0;top:100%;margin-top:4px;z-index:30;' +
      'background:var(--surface);border:1px solid var(--border-forte);border-radius:var(--r-m);' +
      'box-shadow:var(--sombra-g);max-height:320px;overflow-y:auto;"></div>' +
    '<div class="dica">' + (window.PREC_SOLO
      ? 'Ao escolher, regime, atividade, faturamento, notas e CNPJs da mesma raiz entram sozinhos. Tudo pode ser ajustado.'
      : 'Ao escolher, os dados do Monitor entram sozinhos, inclusive o honorário atual. Tudo pode ser ajustado.') +
    '</div></div>';
}
function precLigarCampoCliente(aoEscolher){
  var inp = document.getElementById('pc-emp'), caixa = document.getElementById('pc-sug');
  var lista = [], atual = -1;
  var rotAtiv = {servico:'Serviço', comercio:'Comércio', patrimonial:'Patrimonial', medico:'Saúde'};
  function fechar(){ caixa.hidden = true; inp.setAttribute('aria-expanded', 'false'); atual = -1; }
  function marcar(){
    [].forEach.call(caixa.querySelectorAll('[data-i]'), function(b){
      var on = Number(b.dataset.i) === atual;
      b.style.background = on ? 'var(--verde-claro)' : 'transparent';
      if(on) b.scrollIntoView({block:'nearest'});
    });
  }
  function pintar(){
    lista = precBuscarEmpresas(inp.value);
    if(precNorm(inp.value).trim().length < 2){ fechar(); return; }
    caixa.innerHTML = lista.length ? lista.map(function(e, i){
      var x = precEntradaDe(e);
      return '<button type="button" role="option" data-i="' + i + '" style="display:block;width:100%;text-align:left;' +
        'border:0;border-bottom:1px solid var(--border);background:transparent;padding:8px 12px;cursor:pointer;">' +
        '<div style="font-weight:600;font-size:13px;">' + esc(e.empresa) + '</div>' +
        '<div class="dica" style="margin:0;">' + esc(e.cnpjFmt) + (e.codigoDominio ? ' · cód. ' + esc(e.codigoDominio) : '') +
          ' · ' + esc(PREC_REG[x.regime] || '') + ' · ' + esc(rotAtiv[x.ativ] || '') +
          (x.rbt12 ? ' · ' + fmtBRL(x.rbt12 / 12) + '/mês' : ' · sem faturamento') + '</div></button>';
    }).join('') : '<div class="dica" style="padding:10px 12px;margin:0;">Nenhuma empresa encontrada na base. ' +
      'Pode seguir preenchendo como cliente novo.</div>';
    caixa.hidden = false; inp.setAttribute('aria-expanded', 'true'); atual = lista.length ? 0 : -1; marcar();
  }
  function escolher(i){
    var e = lista[i]; if(!e) return;
    fechar(); inp.value = e.empresa + ' · ' + e.cnpjFmt;
    setTimeout(function(){ aoEscolher(e); }, 0);
  }
  inp.addEventListener('input', pintar);
  inp.addEventListener('focus', function(){ if(!PREC.entrada.cnpj && precNorm(inp.value).trim().length >= 2) pintar(); });
  inp.addEventListener('keydown', function(ev){
    if(caixa.hidden) return;
    if(ev.key === 'ArrowDown'){ ev.preventDefault(); if(lista.length){ atual = (atual + 1) % lista.length; marcar(); } }
    else if(ev.key === 'ArrowUp'){ ev.preventDefault(); if(lista.length){ atual = (atual - 1 + lista.length) % lista.length; marcar(); } }
    else if(ev.key === 'Enter'){ ev.preventDefault(); if(atual >= 0) escolher(atual); }
    else if(ev.key === 'Escape'){ fechar(); }
  });
  caixa.addEventListener('mousedown', function(ev){ ev.preventDefault(); });
  caixa.addEventListener('click', function(ev){
    var b = ev.target.closest ? ev.target.closest('[data-i]') : null;
    if(b) escolher(Number(b.dataset.i));
  });
  caixa.addEventListener('mousemove', function(ev){
    var b = ev.target.closest ? ev.target.closest('[data-i]') : null;
    if(b && Number(b.dataset.i) !== atual){ atual = Number(b.dataset.i); marcar(); }
  });
  inp.addEventListener('blur', function(){ setTimeout(fechar, 120); });
}

function precDesenhar(param){
  var abas = [['calcular','Calcular'],['carteira','Carteira inteira'],['testes','Testes com clientes'],['diretrizes','Diretrizes']];

    (prov ? '<div class="aviso aviso-atencao"><span class="aviso-ico">!</span><div>' +
      'A tabela ainda não foi validada pela liderança e tem perfis sem linha definida. ' +
      'Use para testar, não para mandar proposta.</div></div>' : '') +

      return '<button class="btn btn-p ' + (PREC.aba === a[0] ? 'btn-1' : 'btn-fantasma') +
        '" data-prec-aba="' + a[0] + '">' + a[1] + '</button>';
    }).join('') + '</div><div id="prec-corpo"></div>';
  document.querySelectorAll('[data-prec-aba]').forEach(function(b){
    b.addEventListener('click', function(){ PREC.aba = b.dataset.precAba; limparDrill(); precDesenhar(); });
  });
  if(PREC.aba === 'carteira') precAbaCarteira();
  else if(PREC.aba === 'testes') precAbaTestes();
  else if(PREC.aba === 'diretrizes') precAbaDiretrizes();
  else precAbaCalcular(param);
}

  var ids = ['pc-ativ','pc-reg','pc-rbt','pc-func','pc-notas','pc-atual','pc-rh','pc-bpo','pc-vis','pc-extra',
             'pc-extradesc','pc-inad','pc-pend','pc-comp'].concat(PREC_PARTIC.map(function(p){ return 'pc-p-' + p[0]; }));
  function ler(){

/* ---------------------------------------------------------- aba Carteira */
function precColunas(){
  return [
    ['Empresa',     function(e){ return e.empresa; }, false],
    ['CNPJ',        function(e){ return e.cnpjFmt; }, false],
    ['Atividade',   function(e){ return PREC_ATIV[precAtivDe(e)]; }, false],
    ['Regime',      function(e){ return PREC_REG[precRegimeDe(e)]; }, false],
    ['Paga hoje',   function(e){ return e._prec.atual === null ? 'sem honorário' : e._prec.atual; }, true],
    ['Mínimo',      function(e){ return e._prec.minimo === null ? 'reunião' : e._prec.minimo; }, true],
    ['Tabela',      function(e){ return e._prec.tabela === null ? 'reunião' : e._prec.tabela; }, true],
    ['Falta p/ mínimo', function(e){ return e._prec.faltaMinimo === null ? '—' : e._prec.faltaMinimo; }, true]
  ];
}
function precAbaCarteira(){
  var todas = ativos().map(function(e){ e._prec = precCalcular(precEntradaDe(e)); return e; });
  function por(sit){ return todas.filter(function(e){ return e._prec.situacao === sit; }); }
  var abaixo = por('Abaixo'), neg = por('Negociado'), tab = por('Na tabela'), reun = por('Reunião'), semHon = por('Sem honorário');
  var semLinha = todas.filter(function(e){ return !e._prec.exata; });
  var soma = abaixo.reduce(function(a,e){ return a + e._prec.faltaMinimo; }, 0);
  var op = {colunas:precColunas()};

  document.getElementById('prec-corpo').innerHTML =
    '<div style="font-size:13.5px;margin-bottom:12px;">Pela tabela comercial, <b>' + fmtNum(abaixo.length) +
      '</b> de ' + fmtNum(todas.length) + ' clientes ativos pagam abaixo do mínimo. Só para chegar ao mínimo, são <b>' +
      fmtBRL(soma) + ' por mês</b>. Outros <b>' + fmtNum(semLinha.length) + '</b> caem em perfis que a tabela não cobre.</div>' +
    '<div class="sec"><div class="ind-grade">' +
      indLista('Abaixo do mínimo', fmtNum(abaixo.length), fmtCurto(soma) + '/mês até o mínimo', abaixo.length ? 'alerta' : '',
        'Abaixo do mínimo da tabela', abaixo, Object.assign({subtitulo:'Faltam ' + fmtBRL(soma) + '/mês para todos chegarem ao mínimo.'}, op)) +
      indLista('Entre mínimo e tabela', fmtNum(neg.length), 'margem de negociação', '', 'Entre mínimo e tabela', neg, op) +
      indLista('Na tabela ou acima', fmtNum(tab.length), 'nada a reajustar', '', 'Na tabela ou acima', tab, op) +
      indLista('Precisa de reunião', fmtNum(reun.length), 'tabela manda reunião', '', 'Precisa de reunião', reun, op) +
      indLista('Sem linha exata', fmtNum(semLinha.length), 'perfil que a tabela não tem', semLinha.length ? 'laranja' : '',
        'Perfil sem linha exata na tabela', semLinha, Object.assign({subtitulo:'A calculadora usou a linha mais próxima. ' +
        'Estes perfis mostram o que falta a tabela definir.'}, op)) +
      indLista('Sem honorário', fmtNum(semHon.length), 'sem valor ou não cobramos', '', 'Sem honorário cadastrado', semHon, op) +
    '</div></div>' +
    '<details style="margin:4px 0 12px;"><summary class="dica" style="cursor:pointer;">O que esta conta considera</summary>' +
      '<div class="dica" style="margin-top:6px;">Atividade e regime do cadastro (Serv. Saúde entra como médico, Serv. Patrimonial como ' +
      'patrimonial), faturamento médio dos últimos 12 meses e notas pela média da base. A base não tem o número de funcionários, então ' +
      'todos entram como sem funcionário. Particularidades, RH+, BPO e visitas só entram no cálculo caso a caso.</div></details>' +
    '<div class="filtros">' +
      '<input type="search" id="pca-busca" placeholder="Buscar empresa, CNPJ ou código Domínio…">' +
      '<select id="pca-sit"><option value="">Toda situação</option><option value="Abaixo">Abaixo do mínimo</option>' +
        '<option value="Negociado">Entre mínimo e tabela</option><option value="Na tabela">Na tabela ou acima</option>' +
        '<option value="Reunião">Precisa de reunião</option><option value="Sem honorário">Sem honorário</option></select>' +
      '<select id="pca-ativ"><option value="">Toda atividade</option>' + Object.keys(PREC_ATIV).map(function(k){
        return '<option value="' + k + '">' + PREC_ATIV[k] + '</option>'; }).join('') + '</select>' +
      '<select id="pca-reg"><option value="">Todo regime</option><option value="SN">Simples Nacional</option><option value="LP">Lucro Presumido</option><option value="LR">Lucro Real</option></select>' +
      '<span class="espaco"></span><span class="dica" id="pca-cont" style="margin:0;"></span>' +
      '<button class="btn btn-fantasma btn-p" id="pca-exp">Exportar Excel</button>' +
    '</div><div id="pca-tab"></div>';

  var lista = todas;
  function pintar(){
    var termo = (document.getElementById('pca-busca').value || '').trim().toLowerCase();
    var sit = document.getElementById('pca-sit').value, reg = document.getElementById('pca-reg').value,
        at = document.getElementById('pca-ativ').value;
    lista = todas.filter(function(e){
      if(sit && e._prec.situacao !== sit) return false;
      if(reg && precRegimeDe(e) !== reg) return false;
      if(at && precAtivDe(e) !== at) return false;
      if(termo && !casaBusca(e, termo)) return false;
      return true;
    }).sort(function(a,b){ return num(b._prec.faltaMinimo) - num(a._prec.faltaMinimo); });
    document.getElementById('pca-cont').textContent = 'Mostrando ' + Math.min(lista.length, 150) + ' de ' + fmtNum(lista.length);
    document.getElementById('pca-tab').innerHTML = lista.length ?
      '<div class="tab-caixa"><table><thead><tr><th>Empresa</th><th>Perfil</th><th>Paga hoje</th>' +
      '<th>Mínimo</th><th>Tabela</th><th>Falta p/ mínimo</th><th>Situação</th></tr></thead><tbody>' +
      lista.slice(0, 150).map(function(e){
        var p = e._prec;
        return '<tr class="clicavel" onclick="location.hash=\'#/precificacao/' + e.cnpj + '\'">' +
          '<td><div class="cel-emp"><span class="cel-nome">' + esc(e.empresa) + '</span><span class="cel-cnpj">' + esc(e.cnpjFmt) + '</span></div></td>' +
          '<td style="font-size:12px;">' + esc(PREC_ATIV[precAtivDe(e)] + ' · ' + precRegimeDe(e)) +
            (p.exata ? '' : ' <span class="selo selo-atencao">sem linha</span>') + '</td>' +
          '<td class="mono">' + (p.atual === null ? '—' : fmtBRL(p.atual)) + '</td>' +
          '<td class="mono">' + (p.minimo === null ? '—' : fmtBRL(p.minimo)) + '</td>' +
          '<td class="mono">' + (p.tabela === null ? '—' : fmtBRL(p.tabela)) + '</td>' +
          '<td class="mono">' + (p.faltaMinimo ? fmtBRL(p.faltaMinimo) : '—') + '</td>' +
          '<td>' + precSelo(p.situacao) + '</td></tr>';
      }).join('') + '</tbody></table></div>'
      : '<div class="cartao"><div class="vazio">Nenhuma empresa com esses filtros.</div></div>';
  }
  ['pca-busca','pca-sit','pca-reg','pca-ativ'].forEach(function(id){
    document.getElementById(id).addEventListener(id === 'pca-busca' ? 'input' : 'change', pintar);
  });
  document.getElementById('pca-exp').addEventListener('click', function(){
    exportar('precificacao_carteira', 'Precificação',
      ['CNPJ','Empresa','Atividade','Regime','Faturamento 12m','Média mensal','Notas/mês','Linha da tabela','Linha exata',
       'Paga hoje','Mínimo','Promocional','Tabela','Falta p/ mínimo','Diferença p/ tabela','Situação','Fiscal'],
      lista.map(function(e){
        var p = e._prec, x = precEntradaDe(e);
        return [e.cnpjFmt, e.empresa, PREC_ATIV[x.ativ], PREC_REG[x.regime], x.rbt12, Math.round(x.rbt12 / 12 * 100) / 100,
          x.notasMes, p.linha ? p.linha[0] : '', p.exata ? 'Sim' : 'Não', p.atual === null ? '' : p.atual,
          p.minimo === null ? '' : p.minimo, p.promo === null ? '' : p.promo, p.tabela === null ? '' : p.tabela,
          p.faltaMinimo === null ? '' : p.faltaMinimo, p.diferenca === null ? '' : p.diferenca, p.situacao, e.fiscal || ''];
      }), this);
  });
  pintar();
}

/* ------------------------------------------------------------ aba Testes */
function precAbaTestes(){
  var t = PREC.testes.slice().sort(function(a,b){ return String(b.data || '').localeCompare(String(a.data || '')); });
  var clientes = {};
  t.forEach(function(x){ clientes[x.cnpj || x.empresa] = 1; });
  var Cliente Piloto = ativos().filter(function(e){ return /Cliente Piloto/i.test(e.empresa); })[0];
  function v(n){ return (n === null || n === '' || n === undefined) ? '—' : fmtBRL(n); }
  document.getElementById('prec-corpo').innerHTML = !t.length ?
    '<div class="cartao"><div class="vazio"><div class="vazio-ico">◎</div>Nenhum teste salvo ainda.' +
      '<div class="dica" style="margin-top:6px;">Calcule um cliente real e clique em "Salvar como teste".</div>' +
      (Cliente Piloto ? '<div style="margin-top:12px;"><a class="btn btn-1" href="#/precificacao/' + esc(Cliente Piloto.cnpj) + '">Começar pela Cliente Piloto</a></div>' : '') +
    '</div></div>' :
    '<div style="font-size:13.5px;margin-bottom:12px;"><b>' + fmtNum(t.length) + '</b> teste(s) com <b>' +
      fmtNum(Object.keys(clientes).length) + '</b> cliente(s). O valor mostrado é o do dia do teste: ' +
      'se a tabela mudou, clique em Recalcular.</div>' +
    '<div class="tab-caixa"><table><thead><tr><th>Data</th><th>Cliente</th><th>Paga hoje</th><th>Tabela</th>' +
      '<th>Diferença</th><th>Quem testou</th><th>Comentário</th><th></th></tr></thead><tbody>' +
    t.map(function(x){
      return '<tr><td style="font-size:12px;">' + fmtData(x.data) + '</td>' +
        '<td style="font-size:12px;"><b>' + esc(x.empresa) + '</b></td>' +
        '<td class="mono">' + v(x.atual) + '</td>' +
        '<td class="mono">' + (x.situacao === 'Reunião' ? 'reunião' : v(x.sugerido)) + '</td>' +
        '<td class="mono">' + v(x.diferenca) + '</td>' +
        '<td style="font-size:12px;">' + esc(x.usuario || '—') + '</td>' +
        '<td style="font-size:12px;max-width:260px;">' + esc(x.observacao || '') + '</td>' +
        '<td><div class="acoes"><button class="btn btn-fantasma btn-p" data-pt-abrir="' + esc(x.id) + '">Recalcular</button>' +
        '<button class="btn btn-fantasma btn-p" data-pt-excluir="' + esc(x.id) + '">Excluir</button></div></td></tr>';
    }).join('') + '</tbody></table></div>';

  document.querySelectorAll('[data-pt-abrir]').forEach(function(b){
    b.addEventListener('click', function(){
      var x = PREC.testes.filter(function(z){ return z.id === b.dataset.ptAbrir; })[0];
      if(!x) return;
      PREC.entrada = Object.assign(precEntradaVazia(), x.entrada || {}, {empresa:x.empresa});
      PREC.aba = 'calcular';
      if(location.hash !== '#/precificacao') location.hash = '#/precificacao'; else precDesenhar();
    });
  });
  document.querySelectorAll('[data-pt-excluir]').forEach(function(b){
    b.addEventListener('click', function(){
      var id = b.dataset.ptExcluir;
      abrirModal('Excluir teste', '<div>O teste sai da lista para todos. Confirma?</div>',
        [{rot:'Excluir', perigo:true, aoClicar:function(bb){
          ocupado(bb, true);
          chamar('api_precExcluirTeste', [id], function(){
            fecharModal();
            PREC.testes = PREC.testes.filter(function(z){ return z.id !== id; });
            avisar('Teste excluído.', 'ok'); precAbaTestes();
          }, function(){ ocupado(bb, false); });
        }}]);
    });
  });
}

/* -------------------------------------------------------- aba Diretrizes */
function precCelMeta(ch, obsPadrao, fontePadrao, dis){
  var d = precD(ch) || {};
  return '<td><select class="pd-status"' + dis + '>' + ['Provisório','Validado'].map(function(s){
      return '<option' + (precStatus(ch) === s ? ' selected' : '') + '>' + s + '</option>'; }).join('') + '</select></td>' +
    '<td><input class="pd-fonte" style="width:110px;" value="' + esc(d.fonte !== undefined ? d.fonte : fontePadrao) + '"' + dis + '></td>' +
    '<td><input class="pd-obs" style="min-width:220px;width:100%;" value="' + esc(d.obs !== undefined ? d.obs : obsPadrao) + '"' + dis + '></td>' +
    '<td style="font-size:11.5px;color:var(--texto-suave);">' + (d.alteradoEm ? esc(d.alteradoPor || '') + '<br>' + fmtDataHora(d.alteradoEm) : 'planilha') + '</td>';
}
function precAbaDiretrizes(){
  var ed = PREC.podeEditar, dis = ed ? '' : ' disabled';
  function inp(cls, val, w){
    return '<input type="number" step="any" class="mono ' + cls + '" style="width:' + (w || 90) + 'px;" value="' +
      (val === null || val === undefined ? '' : esc(val)) + '"' + dis + '>';
  }
  var gruposTab = Object.keys(PREC_ATIV);
  var gruposReg = [];
  PREC_REGRAS.forEach(function(r){ if(gruposReg.indexOf(r[1]) < 0) gruposReg.push(r[1]); });

  document.getElementById('prec-corpo').innerHTML =
    (!ed ? '<div class="aviso aviso-info"><span class="aviso-ico">i</span><div>Você tem acesso só para consulta.</div></div>' : '') +
    '<div style="font-size:13.5px;margin-bottom:12px;">Tudo aqui veio da tabela de preços comercial. Linhas em % são do salário mínimo (' +
      fmtBRL(precSM()) + (window.PREC_SOLO ? ', vindo do Monitor). ' : ', em Parâmetros do ano). ') + 'Promocional e mínimo em branco seguem a regra geral de negociação. ' +
      'Quando a liderança confirmar, marque <b>Validado</b>.</div>' +
    gruposTab.map(function(g){
      var rows = PREC_TABELA.filter(function(r){ return r[1] === g; });
      return '<div class="sec"><div class="sec-tit">Tabela base · ' + esc(PREC_ATIV[g]) + '</div><div class="tab-caixa"><table><thead><tr>' +
        '<th>Regime</th><th>Perfil</th><th>Regra</th><th>Tabela</th><th>Promocional</th><th>Mínimo</th>' +
        '<th>Status</th><th>Origem</th><th>Observação</th><th>Última mudança</th></tr></thead><tbody>' +
        rows.map(function(r){
          var re = r[8] === 'reuniao';
          return '<tr data-linha="' + r[0] + '">' +
            '<td style="font-size:12px;">' + (r[2] === '*' ? 'Qualquer' : PREC_REG[r[2]]) + '</td>' +
            '<td style="font-size:12px;">' + esc(precFaixaTxt(r)) + (r[7] ? ' · até ' + r[7] + ' notas' : '') + '</td>' +
            '<td style="font-size:12px;">' + (re ? 'Reunião' : r[8] === 'pct' ? '% do SM' : 'R$ fixo') + '</td>' +
            '<td>' + (re ? '—' : inp('pd-valor', precV(r[0]))) + '</td>' +
            '<td>' + (re ? '—' : inp('pd-p', precVOpc(r[0] + '.p'))) + '</td>' +
            '<td>' + (re ? '—' : inp('pd-m', precVOpc(r[0] + '.m'))) + '</td>' +
            precCelMeta(r[0], r[12], 'Base comercial', dis) + '</tr>';
        }).join('') + '</tbody></table></div></div>';
    }).join('') +
    gruposReg.map(function(g){
      return '<div class="sec"><div class="sec-tit">' + esc(g) + '</div><div class="tab-caixa"><table><thead><tr>' +
        '<th>Regra</th><th>Valor</th><th>Status</th><th>Origem</th><th>Critério escrito</th><th>Última mudança</th>' +
        '</tr></thead><tbody>' +
        PREC_REGRAS.filter(function(r){ return r[1] === g; }).map(function(r){
          return '<tr data-regra="' + r[0] + '">' +
            '<td style="font-size:12.5px;"><b>' + esc(r[2]) + '</b></td>' +
            '<td style="white-space:nowrap;">' + inp('pd-valor', precV(r[0]), 110) + ' <span class="dica" style="margin:0;">' + esc(r[4]) + '</span></td>' +
            precCelMeta(r[0], r[5], r[6], dis) + '</tr>';
        }).join('') + '</tbody></table></div></div>';
    }).join('') +
    (ed ? '<div class="acoes" style="margin-top:6px;"><button class="btn btn-1" id="pd-salvar">Salvar diretrizes</button>' +
      '<span class="dica" style="margin:0;">Vale na hora para todo mundo que usa a calculadora.</span></div>' : '');

  if(!ed) return;
  document.getElementById('pd-salvar').addEventListener('click', function(){
    var b = this, mud = [];
    function meta(tr, ch, obsP, fonteP){
      var d = precD(ch) || {};
      return { status:tr.querySelector('.pd-status').value, fonte:tr.querySelector('.pd-fonte').value.trim(),
        obs:tr.querySelector('.pd-obs').value.trim(),
        mudou:function(item){ return item.status !== precStatus(ch) ||
          item.fonte !== (d.fonte !== undefined ? d.fonte : fonteP) || item.obs !== (d.obs !== undefined ? d.obs : obsP); } };
    }
    function lerNum(el){ if(!el) return undefined; return el.value === '' ? '' : Number(el.value); }
    document.querySelectorAll('tr[data-regra]').forEach(function(tr){
      var ch = tr.dataset.regra, r = PREC_PADRAO[ch], m = meta(tr, ch, r[5], r[6]);
      var item = {chave:ch, valor:lerNum(tr.querySelector('.pd-valor')), status:m.status, fonte:m.fonte, obs:m.obs};
      if(item.valor === '' || isNaN(item.valor)) return;
      if(item.valor !== precV(ch) || m.mudou(item)) mud.push(item);
    });
    document.querySelectorAll('tr[data-linha]').forEach(function(tr){
      var ch = tr.dataset.linha, r = PREC_TAB[ch], m = meta(tr, ch, r[12], 'Base comercial');
      var v = lerNum(tr.querySelector('.pd-valor'));
      var item = {chave:ch, valor:v === undefined ? 0 : v, status:m.status, fonte:m.fonte, obs:m.obs};
      if(item.valor === '' || isNaN(item.valor)) return;
      if((v !== undefined && item.valor !== precV(ch)) || m.mudou(item)) mud.push(item);
      ['p','m'].forEach(function(k){
        var el = tr.querySelector('.pd-' + k); if(!el) return;
        var val = lerNum(el), atual = precVOpc(ch + '.' + k);
        if((val === '' ? null : val) !== atual) mud.push({chave:ch + '.' + k, valor:val, status:m.status, fonte:m.fonte, obs:''});
      });
    });
    if(!mud.length){ avisar('Nada mudou.', 'atencao'); return; }
    ocupado(b, true);
    chamar('api_precSalvarDiretrizes', [mud, S.meta.usuario || ''], function(res){
      ocupado(b, false);
      PREC.diretrizes = res.diretrizes || PREC.diretrizes;
      avisar(res.mensagem || (mud.length + ' regra(s) salva(s).'), 'ok');
      precDesenhar();
    }, function(){ ocupado(b, false); });
  });
}

/* ===========================================================================
   INICIALIZAÇÃO
   =========================================================================== */
(function inicio(){
  try{
    INTERVALO = JSON.parse(localStorage.getItem('escr_intervalos') || '{}');
  }catch(e){ /* navegador sem storage: segue com os padrões */ }

  montarNav();
  // <base target="_top"> é necessário para os links externos (planilha, Drive)
  // abrirem fora do iframe do Apps Script. O efeito colateral é que QUALQUER
  // <a href="#/..."> passa a navegar a janela de cima, o que tirava o usuário
  // do painel. Este delegador intercepta só os links internos de rota e troca
  // a navegação por uma mudança de hash. Links com target explícito passam.
  document.addEventListener('click', function(ev){
    var a = ev.target && ev.target.closest ? ev.target.closest('a[href^="#/"]') : null;
    if(!a) return;
    if(a.getAttribute('target') === '_blank') return;
    ev.preventDefault();
    var destino = a.getAttribute('href');
    if(location.hash !== destino) location.hash = destino; else roteador();
  });

  if(!location.hash) location.hash = '#/dashboard';
  roteador();
  carregar();
})();

/* ---------------------------------------------------------------------------
   Alinhamento de coluna numérica: marca o <th> como .num quando as células
   daquela coluna são .mono. Mantém cabeçalho e número na mesma borda direita,
   como em extrato bancário. Observa só childList — alterar classe não
   re-dispara o observer.
   --------------------------------------------------------------------------- */
(function(){
  function alinharNumericos(raiz){
    var tabs = raiz.querySelectorAll('table');
    for (var t = 0; t < tabs.length; t++){
      var ths = tabs[t].querySelectorAll('thead th');
      var linha = tabs[t].querySelector('tbody tr');
      if (!linha || !ths.length) continue;
      var tds = linha.children;
      for (var i = 0; i < ths.length && i < tds.length; i++){
        if (tds[i].className && tds[i].className.indexOf('mono') >= 0){
          if (ths[i].className.indexOf('num') < 0) ths[i].className += ' num';
        }
      }
    }
  }
  var alvo = document.getElementById('conteudo');
  if (alvo){
    if (window.MutationObserver){
      new MutationObserver(function(){ alinharNumericos(alvo); })
        .observe(alvo, { childList:true, subtree:true });
    }
    alinharNumericos(alvo);
  }
  var m = document.getElementById('modal');
  if (m && window.MutationObserver){
    new MutationObserver(function(){ alinharNumericos(m); })
      .observe(m, { childList:true, subtree:true });
  }
})();
